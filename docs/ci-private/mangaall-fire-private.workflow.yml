# TEMPLATE ONLY. This file is intentionally outside .github/workflows/.
# Copy into .github/workflows/ in a SEPARATE PRIVATE (non-fork) repository.
# NEVER register a self-hosted runner to the public Tsuzuki fork.
# Executes the immutable reviewed Tsuzuki Host and original P-256 signed code10.
name: MangaALL — privately isolated Android code10 source access diagnostic

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: 'Type I_ACCEPT_MANGAFIRE_CI_WEBVIEW_LIVE to allow one bounded 3-work check'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mangaall-private-source-access
  cancel-in-progress: false

jobs:
  private-repository-preflight:
    name: Refuse public repositories and unapproved traffic
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce isolated PRIVATE repository and explicit consent
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
          EVENT: ${{ github.event_name }}
          ACK: ${{ inputs.acknowledge }}
        run: |
          set -euo pipefail
          [[ "$IS_PRIVATE" == 'true' ]] || { echo 'MANGAALL_PRIVATE_CI|outcome=HARD_STOP|reason=PUBLIC_REPOSITORY'; exit 2; }
          [[ "$EVENT" == 'workflow_dispatch' ]] || { echo 'MANGAALL_PRIVATE_CI|outcome=HARD_STOP|reason=MANUAL_ONLY'; exit 2; }
          [[ "$ACK" == 'I_ACCEPT_MANGAFIRE_CI_WEBVIEW_LIVE' ]] || { echo 'MANGAALL_PRIVATE_CI|outcome=HARD_STOP|reason=CONSENT_REQUIRED'; exit 2; }
          echo 'MANGAALL_PRIVATE_CI|preflight=PASS|manual=YES|siteTraffic=NOT_STARTED'

  isolated-android-source-gate:
    name: Ephemeral Linux x64 / KVM / signed code10 three-source CI
    needs: private-repository-preflight
    # All labels are REQUIRED. Provision this label only on a disposable,
    # single-use runner registered to the independent PRIVATE repository.
    runs-on: [self-hosted, Linux, X64, mangaall-ephemeral-android]
    timeout-minutes: 120
    steps:
      - name: Verify disposable Android/KVM host (no sudo, no credentials)
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]] || exit 2
          [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]] || {
            echo 'MANGAALL_PRIVATE_CI|outcome=HARD_STOP|reason=KVM_NOT_AVAILABLE'
            exit 2
          }
          echo 'MANGAALL_PRIVATE_CI|preflight=KVM_READY|network=NOT_STARTED'

      - name: Checkout immutable Tsuzuki experiment (never a PR HEAD)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jssantogit/tsuzuki
          ref: 14af4ef49615336c66a1912ec183f3cc235c02ca
          path: tsuzuki
          persist-credentials: false

      - name: Checkout immutable published provider snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jssantogit/providers-tsuzuki
          ref: 195502f981bd776a68feebde3efc6d20f55cca65
          path: tsuzuki/signed-code10
          persist-credentials: false

      - name: Setup Node.js for index signature verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove exact checked-out refs and P-256 code10 distribution
        working-directory: tsuzuki
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == '14af4ef49615336c66a1912ec183f3cc235c02ca' ]]
          [[ "$(git -C signed-code10 rev-parse HEAD)" == '195502f981bd776a68feebde3efc6d20f55cca65' ]]
          (cd signed-code10 && node tooling/verify_index.mjs)
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          root = Path('signed-code10')
          index = json.loads((root / 'dist/index.payload.json').read_text())
          assert index['repositoryId'] == 'app.tsuzuki.providers'
          assert index['sequence'] == 36
          matches = [p for p in index['providers'] if p['providerId'] == 'app.tsuzuki.mangaall']
          assert len(matches) == 1
          digest = 'bcdfd03ac18c3cfdd0517e08b58dde7efa1f5baa874e93002af28e518860f95f'
          assert matches[0]['versionCode'] == 10 and matches[0]['sha256'] == digest
          asset = root / 'dist/providers/app.tsuzuki.mangaall-10.tsz'
          assert hashlib.sha256(asset.read_bytes()).hexdigest() == digest
          dest = Path('app/src/androidTest/assets/mangaall/code10-published-package.tsz')
          dest.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(asset, dest)
          print('MANGAALL_PRIVATE_CI|signedPackage=P256_VALID|code=10|index=36|network=NOT_STARTED')
          PY

      - name: Setup exact JDK required by Tsuzuki
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: tsuzuki/.github/.java-version
          distribution: temurin

      - name: Gradle setup without persistent writable cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Revalidate production Host, consent and scoped offline contracts
        working-directory: tsuzuki
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/run_mangaall_ci_webview_android.sh
          python3 .github/scripts/test_mangaall_ci_fire_source_gate.py
          python3 .github/scripts/test_mangaall_ci_three_gate.py
          ./gradlew :app:spotlessKotlinCheck :app:assembleDebug :app:assembleDebugAndroidTest
          ./gradlew :app:testDebugUnitTest \
            --tests eu.kanade.tachiyomi.provider.runtime.ProviderBrowserProfilesTest \
            --tests eu.kanade.tachiyomi.provider.runtime.MangaAllMangaFireUserAgentTest \
            --tests eu.kanade.tachiyomi.provider.runtime.MangaAllBrowserHttpContinuationTest \
            --tests eu.kanade.tachiyomi.provider.runtime.MangaAllMangaFireBrowserApiEvidenceTest \
            --tests eu.kanade.tachiyomi.provider.runtime.MangaAllMangaFireXhrHeadersTest

      - name: Run exact signed router and three original works on isolated emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          MANGAALL_CI_WEBVIEW_ACK: I_ACCEPT_MANGAFIRE_CI_WEBVIEW_LIVE
          MANGAALL_CI_GATE_MODE: fire
          MANGAALL_CI_SHAPE_ACK: NOT_AUTHORIZED
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd tsuzuki && bash .github/scripts/run_mangaall_ci_webview_android.sh

      - name: Retain ONLY closed source verdict (never browser data)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mangaall-private-ci-source-verdict
          path: tsuzuki/.github/results/mangaall-ci-webview/verdict.txt
          if-no-files-found: warn
          retention-days: 1
