name: Provider Advanced Extraction — three-work live Android
on:
  push:
    branches: ['feat/provider-platform-v2-advanced-extraction']
    paths: ['.github/provider-advanced-extraction-live.request']
permissions:
  contents: read
concurrency:
  group: advanced-extraction-live-${{ github.ref }}
  cancel-in-progress: false
jobs:
  live-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify explicit live request
        run: test "$(cat .github/provider-advanced-extraction-live.request)" = LIVE_THREE_REQUESTED
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jssantogit/providers-tsuzuki
          ref: 89b5979fff297c2a099359258c9f9249e0089db4
          path: advanced-source
          persist-credentials: false
      - name: Verify strict live verdict contract
        run: python3 .github/scripts/validate_advanced_live_verdicts.py --self-test
      - name: Prepare two transient unsigned live candidates
        run: |
          python3 .github/scripts/build_advanced_extraction_fixtures.py advanced-source
          python3 .github/scripts/build_advanced_extraction_fixtures.py advanced-source --live
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Compile the integrated Host and instrumentation
        run: bash .github/scripts/build_advanced_extraction_android.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run exactly one Android acceptance test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run_provider_advanced_extraction_live.sh
      - name: Preserve sanitized verdicts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: advanced-live-closed-verdicts
          path: .github/results/advanced-live/verdicts.txt
          if-no-files-found: ignore
          retention-days: 3
