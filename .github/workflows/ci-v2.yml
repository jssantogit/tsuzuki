name: CI v2.1
# Resolver PR #140 integration with main: verify the combined tree before merge.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification scope
        required: true
        default: full
        type: choice
        options:
          - affected
          - full
      default_skin_rendered:
        description: Run opt-in Default Skin rendered layout/semantics suite on disposable Android emulator
        required: false
        default: false
        type: boolean
      default_skin_emulator_pre_menu:
        description: Run an opt-in fresh-emulator HOME/ANR diagnostic before one MENU input
        required: false
        default: false
        type: boolean
      default_skin_emulator_menu_ab:
        description: Compare fresh-emulator zero-input control with immediate-MENU treatment
        required: false
        default: false
        type: boolean
      default_skin_emulator_output_forwarding_ab:
        description: Compare emulator output retained-only vs retained-and-forwarded from launch
        required: false
        default: false
        type: boolean
      default_skin_emulator_preboot_logcat_d4:
        description: Compare continuous pre-boot Logcat observation with one post-window final dump
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - 'tsuzuki/**'
      - 'fix/canonical-chapter-resolver-hardening'
      - 'audit/**'
      - 'feat/issue-155-independent-chapter-inventory'
    paths:
      - '**'
      - '!**.md'
      - '!fastlane/**'
      - '!i18n/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals.xml'

concurrency:
  group: ci-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Change Planner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
      compile_matrix: ${{ steps.plan.outputs.compile_matrix }}
      run_tests: ${{ steps.plan.outputs.run_tests }}
      run_compile: ${{ steps.plan.outputs.run_compile }}
      run_format: ${{ steps.plan.outputs.run_format }}
      run_database: ${{ steps.plan.outputs.run_database }}
      run_supabase: ${{ steps.plan.outputs.run_supabase }}
      run_native_package: ${{ steps.plan.outputs.run_native_package }}
      run_release: ${{ steps.plan.outputs.run_release }}
      selected_tests: ${{ steps.plan.outputs.selected_tests }}
      selected_compiles: ${{ steps.plan.outputs.selected_compiles }}
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test CI routing
        run: |
          python3 .github/scripts/test_ci_v2_plan.py
          python3 .github/scripts/test_native_package_gate.py
          python3 .github/scripts/test_apk_lane.py
          python3 .github/scripts/test_extension_fixture.py
          python3 .github/scripts/test_identity_contract.py
          python3 .github/scripts/test_inherited_application_updater_removal.py
          python3 -B .github/scripts/test_default_skin_rendered_evidence.py
          python3 .github/scripts/test_chapter_migration_43.py
          # Uses synthetic local fixtures only; private historical backups never reach CI.
          python3 .github/scripts/test_verify_chapter_migration_43_backup.py
          python3 .github/scripts/identity_contract.py
          bash -n .github/scripts/run_canonical_v2_android.sh

      - name: Ensure experimental exact sync v2 remains disabled in production
        shell: bash
        run: |
          # Removing this guard requires an independently reviewed cloud
          # protocol rollout and legacy-account migration, not a feature toggle.
          if git grep -n -E 'exactVersion2Enabled[[:space:]]*=[[:space:]]*true' -- app/src/main data/src/main domain/src/main; then
            echo "::error::Exact progress v2 cannot be wired to production before protocol migration acceptance"
            exit 1
          fi

      - name: Resolve verification scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          mode="affected"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mode="${REQUESTED_MODE:-full}"
          fi

          case "$REF_NAME" in
            main|tsuzuki/bootstrap)
              mode="full"
              ;;
          esac

          if [[ "$COMMIT_MESSAGE" == *"[ci-full]"* ]]; then
            mode="full"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Collect changed paths
        id: changes
        shell: bash
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          : > changed-paths.txt

          if [ "$MODE" = "full" ]; then
            echo "Full verification requested; diff planning is bypassed."
            exit 0
          fi

          base="$BEFORE_SHA"
          if [ "$EVENT_NAME" != "push" ] || [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::warning::Unable to resolve a reliable base commit; planner will fail safe to full."
            exit 0
          fi

          git diff --name-only "$base" "$GITHUB_SHA" > changed-paths.txt

          echo "Changed paths:"
          cat changed-paths.txt

      - name: Build execution plan
        id: plan
        shell: bash
        env:
          MODE: ${{ steps.scope.outputs.mode }}
        run: |
          python3 .github/scripts/ci_v2_plan.py \
            --mode "$MODE" \
            --paths-file changed-paths.txt \
            | tee -a "$GITHUB_OUTPUT"

      - name: Summarize plan
        shell: bash
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          TESTS: ${{ steps.plan.outputs.selected_tests }}
          COMPILES: ${{ steps.plan.outputs.selected_compiles }}
          DATABASE: ${{ steps.plan.outputs.run_database }}
          SUPABASE: ${{ steps.plan.outputs.run_supabase }}
          NATIVE: ${{ steps.plan.outputs.run_native_package }}
          RELEASE: ${{ steps.plan.outputs.run_release }}
        run: |
          {
            echo "## CI v2.1 execution plan"
            echo
            echo "- Mode: \`$MODE\`"
            echo "- Test shards: \`$TESTS\`"
            echo "- Compile checks: \`$COMPILES\`"
            echo "- SQLDelight migrations: \`$DATABASE\`"
            echo "- Supabase backend: \`$SUPABASE\`"
            echo "- Native package gate: \`$NATIVE\`"
            echo "- Release compile: \`$RELEASE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  format:
    name: Format
    needs: plan
    if: needs.plan.outputs.run_format == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Check code format
        run: ./gradlew spotlessCheck

  tests:
    name: Tests — ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.run_tests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Run ${{ matrix.name }} tests
        id: unit_tests
        shell: bash
        env:
          TEST_FILTER: ${{ matrix.filter }}
          TSUZUKI_CHAPTER_BENCHMARK: ${{ contains(github.event.head_commit.message, '[perf-benchmark]') && 'true' || 'false' }}
          TSUZUKI_BENCHMARK_LABEL: ${{ github.sha }}
        run: |
          args=(./gradlew "${{ matrix.task }}")
          if [ -n "$TEST_FILTER" ]; then
            args+=(--tests "$TEST_FILTER")
          fi
          "${args[@]}"

      - name: Verify canonical backup SQLite test discovery
        if: matrix.key == 'app'
        run: |
          if [ -f app/src/test/java/eu/kanade/tachiyomi/data/backup/restore/CanonicalCoreBackupImporterTest.kt ]; then
            python3 -m unittest discover -s .github/scripts -p 'test_verify_backup_jdbc_report.py'
            python3 .github/scripts/verify_backup_jdbc_report.py app/build/test-results/testDebugUnitTest
          fi

      - name: Upload performance benchmark report
        if: always() && contains(github.event.head_commit.message, '[perf-benchmark]')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-benchmark-${{ matrix.key }}-${{ github.sha }}
          path: |
            data/build/reports/tsuzuki/*.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failed test report
        if: failure() && steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-${{ matrix.key }}-${{ github.sha }}
          path: ${{ matrix.report }}
          if-no-files-found: ignore
          retention-days: 3

  compile:
    name: Compile — ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.run_compile == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.compile_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Run compile check
        run: ./gradlew "${{ matrix.task }}"

  database:
    name: SQLDelight Migrations
    needs: plan
    if: needs.plan.outputs.run_database == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration

  supabase:
    name: Supabase Backend
    needs: plan
    if: needs.plan.outputs.run_supabase == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Supabase project
        id: project
        shell: bash
        run: |
          if [ -f supabase/config.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Supabase project not committed yet; backend lane is ready and intentionally skips."
          fi

      - name: Set up Supabase CLI
        if: steps.project.outputs.present == 'true'
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Authenticate Supabase image pulls from GHCR
        if: steps.project.outputs.present == 'true'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Hosted runners share anonymous registry quotas. Use only this
          # job's ephemeral read-only package token, never a personal token.
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Start database-only Supabase for pgTAP
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: |
          # pgTAP and db reset need PostgreSQL, not the full 13-service
          # development stack. Full-stack pulls exhaust GHCR shared-runner
          # rate limits; excluding non-database services reduces both risk
          # and CI resource use without skipping a single backend assertion.
          excluded="gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor"
          # Retry infrastructure pulls only; database migrations/tests still
          # fail immediately on any assertion or schema error.
          for attempt in 1 2 3 4 5; do
            if supabase start -x "$excluded"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Supabase database startup failed after five attempts"
              exit 1
            fi
            supabase stop --no-backup || true
            sleep "$((attempt * 30))"
          done

      - name: Reset database
        if: steps.project.outputs.present == 'true'
        run: supabase db reset

      - name: Run database tests
        if: steps.project.outputs.present == 'true'
        run: supabase test db

      - name: Stop local Supabase
        if: always() && steps.project.outputs.present == 'true'
        run: supabase stop --no-backup

  native-package:
    name: Native Package Gate
    needs: plan
    if: needs.plan.outputs.run_native_package == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Assemble release package
        run: ./gradlew :app:assembleRelease

      - name: Verify native ABI and 16 KiB compatibility
        shell: bash
        run: |
          zipalign="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -n "$zipalign"
          command -v readelf
          python3 .github/scripts/native_package_gate.py \
            --apk-root app/build/outputs/apk/release \
            --zipalign "$zipalign"

  release:
    name: Release Compile
    needs: plan
    if: needs.plan.outputs.run_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Compile release
        run: ./gradlew assembleRelease -Penable-updater

  default-skin-rendered:
    name: Default Skin rendered validation
    if: ${{ inputs.default_skin_rendered }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Preinstall and verify rendered-test emulator image
        shell: bash
        run: |
          set -uo pipefail
          results_dir='.github/results/default-skin-rendered'
          mkdir -p "$results_dir"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          package='system-images;android-35;google_apis;x86_64'
          image_dir="$sdk_root/system-images/android-35/google_apis/x86_64"
          sdkmanager=''
          if [[ -n "$sdk_root" && -d "$sdk_root/cmdline-tools" ]]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ -z "$sdk_root" || ! -x "$sdkmanager" ]]; then
            printf 'RESULT=INFRASTRUCTURE_FAILURE\nREASON=SDKMANAGER_NOT_FOUND\n' > "$results_dir/run-info.txt"
            echo '::error::Could not locate the Android SDK manager for the rendered-test emulator image'
            exit 1
          fi

          package_operation_archives() {
            if [[ -d "$sdk_root/temp" ]]; then
              find "$sdk_root/temp" -maxdepth 1 -type f -name 'PackageOperation*.zip' -print | sort
            fi
          }

          install_and_verify_image() {
            attempt="$1"
            log_file="$results_dir/sdkmanager-attempt-$attempt.log"
            "$sdkmanager" --install "$package" > "$log_file" 2>&1
            install_status=$?
            if (( install_status != 0 )); then
              cat "$log_file"
              return "$install_status"
            fi
            if [[ ! -s "$image_dir/source.properties" || ! -s "$image_dir/system.img" ]]; then
              echo 'SDK manager completed, but the emulator image is incomplete.'
              cat "$log_file"
              return 1
            fi
          }

          archives_before="$(package_operation_archives)"
          if ! install_and_verify_image 1; then
            echo '::warning::First emulator-image install was incomplete; clearing its partial image and transient package-operation archives before one clean retry.'
            rm -rf "$image_dir"
            while IFS= read -r archive; do
              [[ -z "$archive" ]] && continue
              if ! grep -Fxq "$archive" <<< "$archives_before"; then
                rm -f -- "$archive"
              fi
            done < <(package_operation_archives)
            if ! install_and_verify_image 2; then
              printf 'RESULT=INFRASTRUCTURE_FAILURE\nREASON=EMULATOR_IMAGE_INSTALL_FAILED_AFTER_ONE_RETRY\nPACKAGE=%s\n' \
                "$package" > "$results_dir/run-info.txt"
              echo '::error::Could not install and verify the rendered-test emulator image after one clean retry'
              exit 1
            fi
          fi
          printf 'SYSTEM_IMAGE=%s\nSOURCE_PROPERTIES=%s\n' \
            "$package" "$image_dir/source.properties" > "$results_dir/emulator-image.txt"
          echo 'Verified API 35 Google APIs x86_64 system image for the isolated rendered-test emulator.' >> "$GITHUB_STEP_SUMMARY"

      - name: Run deterministic Default Skin instrumentation and collect evidence
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run_default_skin_rendered_validation.sh

      - name: Report rendered validation outcome
        if: always()
        shell: bash
        run: |
          if [[ -f .github/results/default-skin-rendered/run-info.txt ]]; then
            cat .github/results/default-skin-rendered/run-info.txt
          else
            echo '::warning::Rendered validation produced no runner status file; inspect emulator provisioning and startup output above.'
          fi

      - name: Upload rendered and measured evidence (not a golden approval)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: default-skin-rendered-${{ github.sha }}
          path: .github/results/default-skin-rendered/**
          if-no-files-found: warn
          retention-days: 7

  default-skin-emulator-pre-menu:
    name: Default Skin emulator pre-MENU diagnostic
    if: ${{ inputs.default_skin_emulator_pre_menu }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Test pre-MENU diagnostic helpers
        run: python3 -B .github/scripts/test_default_skin_emulator_pre_menu.py

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator runtime library
        shell: bash
        run: |
          set +e
          results_dir='.github/results/default-skin-pre-menu/runtime-dependencies'
          mkdir -p "$results_dir/config"
          dpkg-query -W -f='${Status} ${Version}\n' libpulse0 \
            > "$results_dir/config/libpulse-before.txt" 2>&1
          before_status=$?
          sudo apt-get update > "$results_dir/config/apt-update.log" 2>&1
          update_status=$?
          sudo apt-get install -y libpulse0 > "$results_dir/config/libpulse-install.log" 2>&1
          install_status=$?
          dpkg-query -W -f='${Status} ${Version}\n' libpulse0 \
            > "$results_dir/config/libpulse-after.txt" 2>&1
          after_status=$?
          printf 'BEFORE_QUERY_EXIT=%s\nAPT_UPDATE_EXIT=%s\nINSTALL_EXIT=%s\nAFTER_QUERY_EXIT=%s\n' \
            "$before_status" "$update_status" "$install_status" "$after_status" \
            > "$results_dir/config/libpulse-status.txt"
          if (( update_status != 0 || install_status != 0 || after_status != 0 )); then
            echo '::error::Could not install or verify the emulator runtime library libpulse0'
            exit 1
          fi

      - name: Observe fresh emulator before and after one MENU input
        shell: bash
        run: bash .github/scripts/probe_default_skin_emulator_pre_menu.sh

      - name: Report pre-MENU diagnostic classification
        if: always()
        shell: bash
        run: |
          if [[ -f .github/results/default-skin-pre-menu/run-info.txt ]]; then
            cat .github/results/default-skin-pre-menu/run-info.txt
          else
            echo '::warning::The pre-MENU diagnostic produced no run-info file; inspect provisioning logs.'
          fi

      - name: Upload pre-MENU diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: default-skin-emulator-pre-menu-${{ github.sha }}
          path: .github/results/default-skin-pre-menu/**
          if-no-files-found: warn
          retention-days: 7

  default-skin-emulator-menu-ab:
    name: Default Skin emulator MENU A/B (${{ matrix.arm }})
    if: ${{ inputs.default_skin_emulator_menu_ab }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        arm: [control, treatment]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Test emulator MENU A/B helpers
        run: |
          python3 -B .github/scripts/test_default_skin_emulator_pre_menu.py
          python3 -B .github/scripts/test_default_skin_emulator_menu_ab.py

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator runtime library
        shell: bash
        env:
          MENU_AB_ARM: ${{ matrix.arm }}
        run: |
          set +e
          results_dir=".github/results/default-skin-menu-ab/$MENU_AB_ARM/runtime-dependencies"
          mkdir -p "$results_dir/config"
          dpkg-query -W -f='${Status} ${Version}\n' libpulse0 \
            > "$results_dir/config/libpulse-before.txt" 2>&1
          before_status=$?
          sudo apt-get update > "$results_dir/config/apt-update.log" 2>&1
          update_status=$?
          sudo apt-get install -y libpulse0 > "$results_dir/config/libpulse-install.log" 2>&1
          install_status=$?
          dpkg-query -W -f='${Status} ${Version}\n' libpulse0 \
            > "$results_dir/config/libpulse-after.txt" 2>&1
          after_status=$?
          printf 'BEFORE_QUERY_EXIT=%s\nAPT_UPDATE_EXIT=%s\nINSTALL_EXIT=%s\nAFTER_QUERY_EXIT=%s\n' \
            "$before_status" "$update_status" "$install_status" "$after_status" \
            > "$results_dir/config/libpulse-status.txt"
          if (( update_status != 0 || install_status != 0 || after_status != 0 )); then
            echo '::error::Could not install or verify the emulator runtime library libpulse0'
            exit 1
          fi

      - name: Observe fresh emulator in the selected A/B arm
        shell: bash
        env:
          MENU_AB_ARM: ${{ matrix.arm }}
        run: bash .github/scripts/probe_default_skin_emulator_pre_menu.sh --menu-ab-arm "$MENU_AB_ARM"

      - name: Report A/B arm evidence
        if: always()
        shell: bash
        env:
          MENU_AB_ARM: ${{ matrix.arm }}
        run: |
          result=".github/results/default-skin-menu-ab/$MENU_AB_ARM/run-info.txt"
          if [[ -f "$result" ]]; then
            cat "$result"
          else
            echo '::warning::The emulator MENU A/B arm produced no run-info file; inspect provisioning output.'
          fi

      - name: Upload A/B arm evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: default-skin-emulator-menu-ab-${{ matrix.arm }}-${{ github.sha }}
          path: .github/results/default-skin-menu-ab/${{ matrix.arm }}/**
          if-no-files-found: warn
          retention-days: 7

  default-skin-emulator-menu-ab-compare:
    name: Compare Default Skin emulator MENU A/B
    if: ${{ always() && inputs.default_skin_emulator_menu_ab }}
    needs: [default-skin-emulator-menu-ab]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download A/B arm artifacts without masking missing evidence
        shell: bash
        env:
