        run: |
          root='.github/results/default-skin-emulator-menu-ab-bundle'
          mkdir -p "$root/control" "$root/treatment"
          for arm in control treatment; do
            artifact="default-skin-emulator-menu-ab-$arm-$GITHUB_SHA"
            set +e
            gh run download "$GITHUB_RUN_ID" --name "$artifact" --dir "$root/$arm" \
              > "$root/$arm-download.log" 2>&1
            status=$?
            set -e
            printf 'ARTIFACT=%s\nDOWNLOAD_EXIT=%s\n' "$artifact" "$status" \
