name: MangaALL — bounded MangaDot creator evidence observation (NONSHIPPING)
on:
  push:
    branches: ['probe/mangaall-dual-source-scale30-*']
    paths: ['.github/workflows/mangaall-mangadot-creator-observation.yml']
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Inspect only existing public MangaDot search DTO creator-field shapes
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/workflows/mangaall-mangadot-creator-observation.yml'
          python3 - <<'PY'
          import json, re, sys, time, subprocess, urllib.request, urllib.parse, urllib.error
          from html.parser import HTMLParser
          sys.path.insert(0, ".github/scripts")
          from run_mangaall_frozen30_independent_catalog import locked_works
          works = locked_works()
          fields = ("author","authors","author_name","author_names","artist","artists","artist_name","creator","creators","writer","writers","staff")
          def normalized(value):
              return " ".join(value.replace("’","'").lower().split()) if isinstance(value,str) else ""
          def nonempty(value):
              return bool(value.strip()) if isinstance(value,str) else bool(value) if isinstance(value,(list,dict)) else False
          observed = 0
          details = []
          for index in (1,3,10,12):
              url = "https://mangadot.net/api/search?" + urllib.parse.urlencode(dict(search=works[index-1], page=1, limit=56))
              request = urllib.request.Request(url, headers={"Accept":"application/json","User-Agent":"Tsuzuki-CI-source-metadata-observation"})
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      raw = response.read(2*1024*1024+1)
                      if len(raw)>2*1024*1024:
                          print(f"DOT_CREATOR|index={index}|outcome=BODY_LIMIT")
                          continue
                      obj = json.loads(raw)
                  rows = obj.get("manga_list", obj.get("results"))
                  if not isinstance(rows,list):
                      print(f"DOT_CREATOR|index={index}|outcome=INVALID_ROWS")
                      continue
                  exact = [r for r in rows if isinstance(r,dict) and normalized(r.get("title"))==normalized(works[index-1])]
                  found = []
                  for field in fields:
                      values = [r[field] for r in exact if field in r and nonempty(r[field])]
                      if values:
                          kinds = sorted(set(type(v).__name__ for v in values))
                          found.append(field+":"+str(len(values))+":"+"/".join(kinds))
                  observed += len(exact)
                  if len(exact)==1:
                      hid=exact[0].get('manga_id',exact[0].get('id'))
                      if re.fullmatch(r'[1-9][0-9]{0,15}',str(hid)):
                          details.append((index,str(hid)))
                  print(f"DOT_CREATOR|index={index}|outcome=HTTP200|rows={len(rows)}|exact={len(exact)}|creatorFields={','.join(found) or 'NONE'}")
              except urllib.error.HTTPError as error:
                  print(f"DOT_CREATOR|index={index}|outcome=HTTP{error.code}")
                  if error.code in (403,429):
                      sys.exit(1)
              except (OSError,ValueError,AttributeError):
                  print(f"DOT_CREATOR|index={index}|outcome=TRANSPORT_OR_SCHEMA_ERROR")
              time.sleep(1)
          print(f"DOT_CREATOR|scope=SEARCH_DTO_ONLY|exactRows={observed}|canonical=NOT_TESTED")
          class Metadata(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.reading=False
                  self.text=[]
                  self.documents=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="script" and dict(attrs).get("type","").lower()=="application/ld+json":
                      self.reading=True
                      self.text=[]
              def handle_data(self,data):
                  if self.reading:
                      self.text.append(data)
              def handle_endtag(self,tag):
                  if tag=="script" and self.reading:
                      try:
                          self.documents.append(json.loads("".join(self.text)))
                      except ValueError:
                          pass
                      self.reading=False
          class SameOrigin(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  target=urllib.parse.urlsplit(newurl)
                  if target.scheme!="https" or target.netloc!="mangadot.net":
                      raise urllib.error.HTTPError(newurl,code,"redirect denied",headers,fp)
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          opener=urllib.request.build_opener(SameOrigin())
          def objects(value,depth=0):
              if depth>12:
                  return
              if isinstance(value,dict):
                  yield value
                  for child in value.values():
                      yield from objects(child,depth+1)
              elif isinstance(value,list):
                  for child in value:
                      yield from objects(child,depth+1)
          for index,hid in details:
              request=urllib.request.Request("https://mangadot.net/manga/"+hid,headers={"Accept":"text/html","User-Agent":"Tsuzuki-CI-source-metadata-observation"})
              try:
                  with opener.open(request,timeout=15) as response:
                      final_url=response.geturl()
                      raw=response.read(2*1024*1024+1)
                      if len(raw)>2*1024*1024:
                          print(f"DOT_DETAIL|index={index}|outcome=BODY_LIMIT")
                          continue
                  parser=Metadata()
                  parser.feed(raw.decode("utf-8",errors="replace"))
                  candidates=[o for doc in parser.documents for o in objects(doc) if normalized(o.get("name"))==normalized(works[index-1])]
                  credited=[o for o in candidates if any(nonempty(o.get(f)) for f in fields)]
                  expected="https://mangadot.net/manga/"+hid
                  def exact_url(value):
                      return isinstance(value,str) and value.rstrip("/")==expected
                  def author_names(value):
                      entries=value if isinstance(value,list) else [value]
                      return [e["name"] for e in entries if isinstance(e,dict) and e.get("@type")=="Person" and isinstance(e.get("name"),str) and e["name"].strip()]
                  known={"Book","ComicSeries","ComicStory","CreativeWork","Article","WebPage","Manga","Person","ListItem"}
                  types=[o.get("@type") for o in credited]
                  types=[t if isinstance(t,str) and t in known else "OTHER" for t in types]
                  exact_ref=sum(exact_url(o.get("url")) or exact_url(o.get("@id")) for o in credited)
                  people=sum(len(author_names(o.get("author"))) for o in credited)
                  # Only public bibliographic creator credits; no chapter content or raw HTML.
                  print("DOT_PUBLIC_CREDITS|index="+str(index)+"|names="+json.dumps([n[:128] for o in credited for n in author_names(o.get("author"))][:12],ensure_ascii=True))
                  query="query { mangas(search: "+json.dumps(works[index-1])+", page: 1, limit: 25, order: popularity, kind: \"manhwa\") { id name english japanese synonyms personRoles { person { name } rolesEn } } }"
                  catalog_request=urllib.request.Request("https://shikimori.io/api/graphql",data=json.dumps({"query":query}).encode(),headers={"Content-Type":"application/json","Accept":"application/json","User-Agent":"Tsuzuki-CI-catalog-contract-observation"},method="POST")
                  with urllib.request.urlopen(catalog_request,timeout=15) as resp:
                      catalog_raw=resp.read(512*1024+1)
                  if len(catalog_raw)>512*1024:
                      raise ValueError("catalog bound")
                  rows=json.loads(catalog_raw).get("data",{}).get("mangas",[])
                  exact_catalog=[r for r in rows if normalized(r.get("name"))==normalized(works[index-1])]
                  if len(exact_catalog)==1:
                      roles=exact_catalog[0].get("personRoles") or []
                      names=[str((p.get("person") or {}).get("name") or "")[:128] for p in roles if isinstance(p,dict) and any("Story" in x or "Art" in x for x in p.get("rolesEn") or [])]
                      print("SHIKI_PUBLIC_CREDITS|index="+str(index)+"|names="+json.dumps(names[:12],ensure_ascii=True))
                  # Independent MangaUpdates detail credits and author IDs, for diagnosis only.
                  # Bounded search; never interpret first-page observations as a unique catalog proof.
                  mu_data=dict(search=works[index-1],page=1,perpage=25,type=["Manhwa"],filter_types=["drama cd","novel"])
                  mu_headers={"Content-Type":"application/json","Accept":"application/json","User-Agent":"Tsuzuki-CI-catalog-contract-observation"}
                  mu_request=urllib.request.Request("https://api.mangaupdates.com/v1/series/search",data=json.dumps(mu_data).encode(),headers=mu_headers,method="POST")
                  with urllib.request.urlopen(mu_request,timeout=15) as resp:
                      mu_raw=resp.read(512*1024+1)
                  if len(mu_raw)>512*1024:
                      raise ValueError("MU search bound")
                  mu_rows=json.loads(mu_raw).get("results",[])
                  mu_exact=[r.get("record",{}) for r in mu_rows if isinstance(r,dict) and normalized(r.get("record",{}).get("title"))==normalized(works[index-1])]
                  if len(mu_exact)==1:
                      mu_id=mu_exact[0].get("series_id")
                      if type(mu_id) is int and mu_id>0:
                          req=urllib.request.Request("https://api.mangaupdates.com/v1/series/"+str(mu_id),headers=mu_headers)
                          with urllib.request.urlopen(req,timeout=15) as resp:
                              mu_detail_raw=resp.read(512*1024+1)
                          if len(mu_detail_raw)>512*1024:
                              raise ValueError("MU detail bound")
                          mu_detail=json.loads(mu_detail_raw)
                          if mu_detail.get("series_id")==mu_id and normalized(mu_detail.get("title"))==normalized(works[index-1]):
                              mu_credits=[{"name":str(a.get("name") or "")[:128],"role":str(a.get("type") or "")[:40],"hasAuthorId":type(a.get("author_id")) is int} for a in mu_detail.get("authors",[]) if isinstance(a,dict)]
                              print("MU_PUBLIC_CREDITS|index="+str(index)+"|credits="+json.dumps(mu_credits[:12],ensure_ascii=True))

                  url_exact=sum(exact_url(o.get("url")) for o in credited)
                  id_exact=sum(exact_url(o.get("@id")) for o in credited)
                  id_present=sum(o.get("@id") is not None for o in credited)
                  def same_document_fragment(value):
                      if not isinstance(value,str) or "#" not in value:
                          return False
                      base,fragment=value.split("#",1)
                      return exact_url(base) and re.fullmatch(r"[A-Za-z0-9_-]{1,64}",fragment) is not None
                  id_same_document=sum(same_document_fragment(o.get("@id")) for o in credited)
                  id_relative_fragment=sum(isinstance(o.get("@id"),str) and re.fullmatch(r"#[A-Za-z0-9_-]{1,64}",o["@id"]) is not None for o in credited)

                  url_present=sum(o.get("url") is not None for o in credited)
                  parsed_ok=False
                  if len(parser.documents)==1:
                      payload=json.dumps({"raw":json.dumps(parser.documents[0]),"id":hid,"title":works[index-1]})
                      check=subprocess.run(["node","--input-type=module","-e",
                          'import fs from "node:fs"; import {extractMangaDotCreators} from "./.github/scripts/mangaall_mangadot_creator_evidence.mjs"; const p=JSON.parse(fs.readFileSync(0,"utf8")); process.exit(extractMangaDotCreators(p.raw,p.id,p.title)?0:1);'],
                          input=payload,text=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=5)
                      parsed_ok=check.returncode==0

                  print(f"DOT_DETAIL|index={index}|outcome=HTTP200|bytes={len(raw)}|finalUrlExact={exact_url(final_url)}|structuredDocuments={len(parser.documents)}|exactNamedObjects={len(candidates)}|withCreatorFields={len(credited)}|types={','.join(types) or 'NONE'}|exactWorkRef={exact_ref}|authorPersons={people}|urlExact={url_exact}|idExact={id_exact}|idPresent={id_present}|urlPresent={url_present}|idSameDocumentFragment={id_same_document}|idRelativeFragment={id_relative_fragment}|strictParser={parsed_ok}")
              except urllib.error.HTTPError as error:
                  print(f"DOT_DETAIL|index={index}|outcome=HTTP{error.code}")
                  if error.code in (403,429):
                      sys.exit(1)
              except (OSError,ValueError,AttributeError):
                  print(f"DOT_DETAIL|index={index}|outcome=TRANSPORT_OR_SCHEMA_ERROR")
              time.sleep(1)

          PY
