name: MangaALL — bounded MangaUpdates pagination wire observation (NONSHIPPING)
on:
  push:
    branches: ['probe/mangaall-dual-source-scale30-*']
    paths: ['.github/workflows/mangaall-catalog-geometry-observation.yml']
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Observe public catalog pagination for fixed corpus indices, never store raw records
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/workflows/mangaall-catalog-geometry-observation.yml'
          python3 - <<'PY'
          import json, sys, time, urllib.request, urllib.error
          sys.path.insert(0, ".github/scripts")
          from run_mangaall_frozen30_independent_catalog import locked_works
          works = locked_works()
          # Independent catalog native names observed in Shikimori; do not change the frozen identities.
          native={2: "전지적 독자 시점", 28: "그녀가 공작저로 가야 했던 사정", 29: "치즈인더트랩"}
          for index in (2,28,29):
              for scope in ("NATIVE_TITLE",):
                  data = dict(search=works[index-1], page=1, perpage=25, filter_types=["drama cd","novel"])
                  data["type"] = ["Manhwa"]
                  if scope == "NATIVE_TITLE":
                      data["search"] = native[index]
                  request = urllib.request.Request(
                      "https://api.mangaupdates.com/v1/series/search",
                      data=json.dumps(data).encode(),
                      headers={"Content-Type":"application/json","Accept":"application/json",
                               "User-Agent":"Tsuzuki-CI-catalog-contract-observation"},
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=15) as response:
                          raw = response.read(2*1024*1024+1)
                          if len(raw) > 2*1024*1024:
                              candidates=[r for r in records if isinstance(r,dict) and str(r.get("title","")).strip().casefold()==works[index-1].casefold()]
                      if len(candidates)==1:
                          item_id=candidates[0].get("series_id")
                          if type(item_id) is int and item_id>0:
                              detail_req=urllib.request.Request(f"https://api.mangaupdates.com/v1/series/{item_id}",headers={"Accept":"application/json","User-Agent":"Tsuzuki-CI-catalog-contract-observation"})
                              with urllib.request.urlopen(detail_req,timeout=15) as resp:
                                  detail_raw=resp.read(512*1024+1)
                              if len(detail_raw)>512*1024:
                                  raise ValueError("detail bound")
                              detail=json.loads(detail_raw)
                              title_set=names(detail)
                              detail_original=any(isinstance(v,str) and v.strip().casefold()==works[index-1].casefold() for v in title_set)
                              detail_native=any(isinstance(v,str) and v.strip()==native[index] for v in title_set)
                              creators=detail.get("authors") or []
                              print(f"MU_DETAIL|index={index}|sameId={detail.get('series_id')==item_id}|format={str(detail.get('type','')).lower()=='manhwa'}|original={detail_original}|native={detail_native}|creatorCount={len(creators)}")
                      print(f"MU_WIRE|index={index}|scope={scope}|outcome=BODY_LIMIT")
                              continue
                          obj = json.loads(raw)
                      rows = obj.get("results")
                      if not isinstance(rows, list):
                          print(f"MU_WIRE|index={index}|scope={scope}|outcome=INVALID_ROWS")
                          continue
                      def number(key):
                          v=obj.get(key)
                          return v if type(v) is int else -1
                      records = [r.get("record", {}) for r in rows if isinstance(r, dict)]
                      ids = [r.get("series_id") for r in records if isinstance(r, dict)]
                      valid = [i for i in ids if type(i) is int and i>0]
                      format_count = sum(isinstance(r, dict) and str(r.get("type","")).lower()=="manhwa" for r in records)
                      exact=sum(isinstance(r,dict) and str(r.get("title","")).strip().casefold()==works[index-1].casefold() for r in records)
                      # Observe associated names only for exact or native matches; retain counts, never fabricate aliases.
                      def names(r):
                          return [r.get("title","")]+[a.get("title","") for a in r.get("associated",[]) if isinstance(a,dict)]
                      alias_exact=sum(any(isinstance(v,str) and v.strip().casefold()==works[index-1].casefold() for v in names(r)) for r in records)
                      native_exact=sum(any(isinstance(v,str) and v.strip()==native[index] for v in names(r)) for r in records)
                      print(f"MU_WIRE|index={index}|scope={scope}|outcome=HTTP200|page={number('page')}|size={number('per_page')}|total={number('total_hits')}|rows={len(rows)}|positiveIds={len(valid)}|duplicateIds={len(valid)-len(set(valid))}|manhwaRows={format_count}|exactPrimary={exact}|exactAnyTitle={alias_exact}|exactNative={native_exact}")
                  except urllib.error.HTTPError as error:
                      print(f"MU_WIRE|index={index}|scope={scope}|outcome=HTTP{error.code}")
                      if error.code in (403,429):
                          sys.exit(1)
                  except (OSError,ValueError,AttributeError):
                      print(f"MU_WIRE|index={index}|scope={scope}|outcome=TRANSPORT_OR_SCHEMA_ERROR")
                  time.sleep(2)
          PY
