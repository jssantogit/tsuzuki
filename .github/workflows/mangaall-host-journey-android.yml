name: MangaAll Host-to-Reader segmented Android acceptance

# Opt-in test branch, not a shipping package or full MangaAll UI E2E.
on:
  push:
    branches:
      - 'tsuzuki/provider-platform-mangaall-host-journey-*'
    paths:
      - '.github/workflows/mangaall-host-journey-android.yml'
      - '.github/scripts/run_mangaall_host_journey_android.sh'
      - 'app/src/androidTest/java/eu/kanade/tachiyomi/provider/reading/ScriptProviderReadingGatewayIsolationTest.kt'
      - 'app/src/androidTest/java/eu/kanade/presentation/reader/MangaAllReaderSourceCardInstrumentedTest.kt'
      - 'app/src/androidTest/java/eu/kanade/tachiyomi/data/tsuzuki/instrumentation/CanonicalReaderSourceSwitchInstrumentedTest.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mangaall-host-journey-segmented
  cancel-in-progress: true

jobs:
  segmented-fixture:
    name: SCRIPT canonical refresh + Reader UI/pixel gates (separate fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell gate
        run: bash -n .github/scripts/run_mangaall_host_journey_android.sh
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Compile app + instrumentation
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate Host and pixel Reader stages on disposable emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run_mangaall_host_journey_android.sh
      - name: Preserve bounded regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mangaall-host-reader-segmented
          path: .github/results/mangaall-host-journey-android/**
          if-no-files-found: ignore
          retention-days: 3
