name: MangaAll code7 package / Host-to-Reader Android acceptance

# Opt-in test branch, not an official signed install or live MangaFire acceptance.
on:
  push:
    branches:
      - 'tsuzuki/provider-platform-mangaall-host-journey-*'
      - 'fix/mangaall-host-full-journey-*'
      - 'feat/mangaall-live-android-page-gate-*'
    paths:
      - '.github/workflows/mangaall-host-journey-android.yml'
      - '.github/scripts/run_mangaall_host_journey_android.sh'
      - 'app/src/androidTest/java/eu/kanade/tachiyomi/provider/reading/ScriptProviderReadingGatewayIsolationTest.kt'
      - 'app/src/androidTest/java/eu/kanade/tachiyomi/provider/repository/MangaAllSignedUpgradeIsolationTest.kt'
      - 'app/src/androidTest/java/eu/kanade/presentation/reader/MangaAllReaderSourceCardInstrumentedTest.kt'
      - 'app/src/androidTest/java/eu/kanade/tachiyomi/data/tsuzuki/instrumentation/CanonicalReaderSourceSwitchInstrumentedTest.kt'
      - 'app/src/androidTest/java/eu/kanade/tachiyomi/data/tsuzuki/instrumentation/MangaAllReaderJourneyFixture.kt'
      - 'app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderViewModel.kt'
      - 'app/src/main/java/eu/kanade/tachiyomi/ui/reader/loader/ProviderHttpPageLoader.kt'
      - 'app/src/main/java/eu/kanade/tachiyomi/provider/runtime/ProviderHostInvocation.kt'
  pull_request:
    paths:
      - '.github/workflows/mangaall-host-journey-android.yml'
      - '.github/scripts/run_mangaall_host_journey_android.sh'
      - 'app/src/androidTest/java/eu/kanade/tachiyomi/data/tsuzuki/instrumentation/MangaAllReaderJourneyFixture.kt'
      - 'app/src/androidTest/java/eu/kanade/tachiyomi/data/tsuzuki/instrumentation/CanonicalReaderSourceSwitchInstrumentedTest.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mangaall-host-journey-segmented
  cancel-in-progress: true

jobs:
  segmented-fixture:
    name: Original code7 .tsz + continuous ReaderActivity pixel acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout pinned MangaAll code7 JS (Provider #64, without publication)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jssantogit/providers-tsuzuki
          ref: e74a0ebb43ce27b3a237a80bf9d1c81df1397ee3
          path: code7-mangaall
          persist-credentials: false
      - name: Checkout immutable published MangaAll code8 from official repository (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jssantogit/providers-tsuzuki
          ref: 99f3565a1e1edc0d8ed249b7597006c897f02636
          path: code8-published
          persist-credentials: false
      - name: Checkout byte-reviewed, SOURCE-ONLY MangaAll code9 (not indexed or signed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jssantogit/providers-tsuzuki
          ref: 1314775fd0637aef5b4d153eea423e35bc0e3ac3
          path: code9-reviewed
          persist-credentials: false
      - name: Checkout immutable official signed sequence 32 / MangaAll code6 (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jssantogit/providers-tsuzuki
          ref: 3e0b0bc813910929c2215ad26bc46ff5a6a73706
          path: code6-published
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real published code6 envelope, trust key and artifact (no signing)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C code6-published rev-parse HEAD)" = '3e0b0bc813910929c2215ad26bc46ff5a6a73706'
          ( cd code6-published && node tooling/verify_index.mjs )
          python3 - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path
          root = Path('code6-published')
          payload = json.loads((root/'dist/index.payload.json').read_text())
          enrollment = json.loads((root/'dist/enrollment.json').read_text())
          assert payload['repositoryId'] == 'app.tsuzuki.providers' and payload['sequence'] == 32
          assert enrollment['repositoryId'] == payload['repositoryId']
          assert enrollment['keyId'] == 'tsuzuki-provider-root-2026-02'
          matches = [p for p in payload['providers'] if p['providerId'] == 'app.tsuzuki.mangaall']
          assert len(matches) == 1 and matches[0]['versionCode'] == 6
          assert matches[0]['versionName'] == '0.5.1'
          package = root/'dist/providers/app.tsuzuki.mangaall-6.tsz'
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          assert digest == matches[0]['sha256']
          assert digest == 'aa9c101e0764019bc0d09774aeea1600e6bb9f02e12e9c9096f37d0549720320'
          out = Path('app/src/androidTest/assets/mangaall')
          out.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(package, out/'code6-published-package.tsz')
          shutil.copyfile(root/'dist/index.json', out/'code6-published-index.json')
          shutil.copyfile(root/'dist/enrollment.json', out/'code6-enrollment.json')
          print('MANGAALL_SIGNED_BASELINE|repository=app.tsuzuki.providers|sequence=32|providerCode=6|signature=VERIFIED|package=ORIGINAL')
          PY
      - name: Validate original official code8 signed root and stage immutable AndroidTest package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C code8-published rev-parse HEAD)" = '99f3565a1e1edc0d8ed249b7597006c897f02636'
          ( cd code8-published && node tooling/verify_index.mjs )
          python3 - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path
          root = Path('code8-published')
          payload = json.loads((root/'dist/index.payload.json').read_text())
          assert payload['repositoryId'] == 'app.tsuzuki.providers'
          assert payload['sequence'] == 34
          matches = [p for p in payload['providers'] if p['providerId'] == 'app.tsuzuki.mangaall']
          assert len(matches) == 1
          assert matches[0]['versionName'] == '0.5.3' and matches[0]['versionCode'] == 8
          archive = root/'dist/providers/app.tsuzuki.mangaall-8.tsz'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == matches[0]['sha256']
          dest = Path('app/src/androidTest/assets/mangaall/code8-published-package.tsz')
          dest.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(archive, dest)
          print('MANGAALL_PUBLISHED_CODE8_READER|signature=VERIFIED|sha=VERIFIED|http=CONTROLLED')
          PY
      - name: Verify exact code9 source, original P-256 code8 index and build UNSIGNED AndroidTest package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C code9-reviewed rev-parse HEAD)" = 1314775fd0637aef5b4d153eea423e35bc0e3ac3
          (cd code9-reviewed && node tooling/verify_index.mjs)
          python3 code9-reviewed/tooling/build_provider.py \
            code9-reviewed/providers/mangaall \
            app/src/androidTest/assets/mangaall/code9-reviewed-unsigned.tsz
          python3 - <<'PY'
          import hashlib, json, pathlib, sys, tempfile
          source = pathlib.Path('code9-reviewed')
          source_manifest = json.loads((source / 'providers/mangaall/manifest.json').read_text())
          signed_index = json.loads((source / 'dist/index.payload.json').read_text())
          assert source_manifest['version'] == {'name': '0.5.4', 'code': 9}
          assert source_manifest['publication'] == 'release'
          assert signed_index['sequence'] == 34
          indexed = [p for p in signed_index['providers'] if p['providerId'] == 'app.tsuzuki.mangaall']
          assert len(indexed) == 1 and indexed[0]['versionCode'] == 8
          sys.path.insert(0, str(source / 'tooling'))
          from mangaall_code9_review_source import materialize_review_code9
          with tempfile.TemporaryDirectory(prefix='host-code9-review-parity-') as temp:
              reviewed = materialize_review_code9(pathlib.Path(temp) / 'reviewed')
              actual = pathlib.Path('app/src/androidTest/assets/mangaall/code9-reviewed-unsigned.tsz')
              assert reviewed.read_bytes() == actual.read_bytes(), 'Unreviewed code9 package bytes'
              assert hashlib.sha256(actual.read_bytes()).hexdigest() != indexed[0]['sha256']
          print('CODE9_REVIEWED_TSZ|sha=REVIEWED_EXACT|sourceCode=9|signedIndex=CODE8_ONLY|network=OFFLINE|install=NONE')
          PY
      - name: Generate code7 replay vectors from actual JS (offline fixture only)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C code7-mangaall rev-parse HEAD)" = "e74a0ebb43ce27b3a237a80bf9d1c81df1397ee3"
          mkdir -p app/src/androidTest/assets/mangaall
          ( cd code7-mangaall && node tooling/test_mangaall_code7_host_contract_replay.mjs --export ../app/src/androidTest/assets/mangaall/code7-replay.json )
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('app/src/androidTest/assets/mangaall/code7-replay.json')
          d = json.loads(p.read_text())
          assert d['schemaVersion'] == 1 and d['providerVersionCode'] == 7
          assert d['providerId'] == 'app.tsuzuki.mangaall'
          assert set(x['caseId'] for x in d['cases']) == {'punpun', 'koe'}
          assert d['preferredEmpty'] == {'source':'mangadex','itemCount':0,'complete':True}
          assert d['challenge'] == {'source':'mangafire','outcome':'CHALLENGE_BLOCKED','complete':False}
          print('CODE7_HOST_VECTOR|realProviderJS=PINNED|cases=2|sourceHTTP=SYNTHETIC|secretBytes=NONE')
          PY
      - name: Build exact code7 .tsz from pinned unpublished Provider source
        shell: bash
        run: |
          set -euo pipefail
          python3 code7-mangaall/tooling/build_provider.py \
            code7-mangaall/providers/mangaall \
            app/src/androidTest/assets/mangaall/code7-package.tsz
          python3 - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path
          root = Path('code7-mangaall/providers/mangaall')
          package = Path('app/src/androidTest/assets/mangaall/code7-package.tsz')
          with zipfile.ZipFile(package) as archive:
              names = archive.namelist()
              manifest = json.loads(archive.read('manifest.json'))
              assert manifest['id'] == 'app.tsuzuki.mangaall'
              assert manifest['version'] == {'name': '0.5.2', 'code': 7}
              assert manifest['entrypoint'] == 'main.js'
              assert 'publication' not in manifest
              assert 'publication' in json.loads((root/'manifest.json').read_text())
              paths = sorted(p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file())
              assert sorted(names) == paths
              for name in names:
                  if name != 'manifest.json':
                      assert archive.read(name) == (root/name).read_bytes(), name
              digest = hashlib.sha256(package.read_bytes()).hexdigest()
              print('CODE7_PACKAGED|provider=app.tsuzuki.mangaall|code=7|modules=ORIGINAL|sourceHTTP=SYNTHETIC|signedFeed=NOT_TESTED|sha256=' + digest)
          PY
      - name: Check shell gate
        run: bash -n .github/scripts/run_mangaall_host_journey_android.sh
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Fail closed if production or instrumented Kotlin formatting drifts
        run: ./gradlew :app:spotlessKotlinCheck
      - name: Compile app + instrumentation
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate Host and pixel Reader stages on disposable emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run_mangaall_host_journey_android.sh
        env:
          MANGAALL_CODE8_ONLY: ${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feat/mangaall-live-android-page-gate-')) && '1' || '0' }}
      - name: Preserve bounded regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mangaall-host-reader-segmented
          path: .github/results/mangaall-host-journey-android/**
          if-no-files-found: ignore
          retention-days: 3
