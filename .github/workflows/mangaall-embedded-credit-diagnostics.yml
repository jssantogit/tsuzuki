name: MangaALL — embedded work-credit metadata diagnostics (NO READER)
on:
  push:
    branches: ['probe/mangaall-dual-source-scale30-*']
    paths:
      - '.github/workflows/mangaall-embedded-credit-diagnostics.yml'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        index: [15, 21, 27]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Observe exact work-scoped inert JSON credit fields only
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/observe_mangaall_embedded_credits.py
          python3 .github/scripts/observe_mangaall_embedded_credits.py --selftest
          python3 .github/scripts/observe_mangaall_embedded_credits.py --index ${{ matrix.index }}
