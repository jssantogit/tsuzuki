name: MangaALL — isolated private runner template static safety contract
# This workflow NEVER uses a private runner or accesses MangaFire.
on:
  push:
    branches: ['probe/mangaall-a54-browser-profile-validation-*']
    paths:
      - 'docs/ci-private/**'
      - '.github/scripts/test_mangaall_ci_private_runner_template.py'
      - '.github/workflows/mangaall-private-runner-template-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mangaall-private-template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-template-offline:
    name: GitHub-hosted Python + Ruby YAML contract, NO provider network
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify private-only gating and hostile mutation rejections
        run: python3 .github/scripts/test_mangaall_ci_private_runner_template.py
      - name: Parse example workflow YAML without running it
        run: |
          ruby - <<'RUBY'
          require 'yaml'
          path = 'docs/ci-private/mangaall-fire-private.workflow.yml'
          workflow = YAML.load_file(path)
          abort 'not a yaml mapping' unless workflow.is_a?(Hash)
          abort 'wrong private job scope' unless workflow.dig('jobs', 'isolated-android-source-gate', 'runs-on') ==
            ['self-hosted', 'Linux', 'X64', 'mangaall-ephemeral-android']
          # Ruby Psych uses YAML 1.1 where the unquoted "on" may parse as true.
          # GitHub Actions correctly interprets it as the event key.
          triggers = workflow['on'] || workflow[true]
          abort 'wrong triggers' unless triggers.is_a?(Hash) && triggers.keys == ['workflow_dispatch']
          abort 'private preflight missing' unless workflow.fetch('jobs').key?('private-repository-preflight')
          puts 'MANGAALL_PRIVATE_CI_TEMPLATE|yaml=PASS|offline=YES|runner=NONE|network=NOT_STARTED'
          RUBY
