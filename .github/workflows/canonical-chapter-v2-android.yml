name: Canonical Chapter v2 Android Gate

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/canonical-chapter-resolver-hardening'
    paths:
      - '.github/workflows/canonical-chapter-v2-android.yml'
      - '.github/scripts/run_canonical_v2_android.sh'
      - 'app/src/androidTest/java/eu/kanade/tachiyomi/data/tsuzuki/instrumentation/**'

permissions:
  contents: read

concurrency:
  group: chapter-v2-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader-emulator:
    name: Disposable Reader Navigation Emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check instrumentation runner script
        run: bash -n .github/scripts/run_canonical_v2_android.sh

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Compile app and Android instrumentation
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Reader smoke regressions on a disposable Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run_canonical_v2_android.sh

      - name: Upload short-lived test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-v2-android-${{ github.sha }}
          path: .github/results/canonical-v2-android/**
          if-no-files-found: ignore
          retention-days: 3
