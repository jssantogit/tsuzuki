name: MangaALL — MangaDot creator evidence through real Android Host (OPT-IN)
on:
  push:
    branches: ['probe/mangaall-dual-source-scale30-*']
    paths: ['.github/workflows/mangaall-mangadot-creator-android.yml']
permissions:
  contents: read
concurrency:
  group: mangaall-mangadot-creator-android
  cancel-in-progress: true
jobs:
  parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Require workflow-only opt-in and verify adversarial source parser
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = '.github/workflows/mangaall-mangadot-creator-android.yml'
          bash -n .github/scripts/run_mangaall_mangadot_creator_android.sh
          node .github/scripts/test_mangaall_mangadot_creator_evidence.mjs
          python3 -m py_compile .github/scripts/mangaall_code11_dual_source_unsigned.py
          python3 .github/scripts/run_mangaall_frozen30_independent_catalog.py --check-lock
  android:
    needs: parser
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jssantogit/providers-tsuzuki
          ref: 89b5979fff297c2a099359258c9f9249e0089db4
          path: future-code11-source
          persist-credentials: false
      - name: Stage isolated unsigned creator-evidence ZIP and locked cohort
        run: |
          set -euo pipefail
          mkdir -p app/src/androidTest/assets
          cp .github/mangaall-dual-source-30-cohort-lock.json app/src/androidTest/assets/
          python3 .github/scripts/mangaall_code11_dual_source_unsigned.py --source future-code11-source --manhwa-only --mangadot-creators --output app/src/androidTest/assets/mangaall-dual-source-code11-unsigned-research.zip
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: true
      - name: Run discoverable JUnit DOM regressions and build Android APKs
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          for attempt in 1 2 3; do
            if ./gradlew :core:common:spotlessKotlinCheck :app:spotlessKotlinCheck :core:common:testDebugUnitTest --tests 'tachiyomi.core.provider.runtime.ProviderHostTransformServicesTest' :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace >"$log" 2>&1; then
              cat "$log"
              python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path("core/common/build/test-results/testDebugUnitTest/TEST-tachiyomi.core.provider.runtime.ProviderHostTransformServicesTest.xml")
          root=ET.parse(p).getroot()
          assert int(root.attrib["tests"]) >= 6
          assert all(int(root.attrib.get(k, "0")) == 0 for k in ("failures", "errors", "skipped"))
          print("MANGAALL_DOT_CREATOR|domTests="+root.attrib["tests"]+"|outcome=PASS")
          PY
              exit 0
            fi
            if ! grep -Eq 'Received status code 429|Too Many Requests' "$log" || [[ "$attempt" -eq 3 ]]; then
              cat "$log"
              exit 1
            fi
            sleep "$((attempt * 45))"
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real source metadata through QuickJS and Binder
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run_mangaall_mangadot_creator_android.sh
