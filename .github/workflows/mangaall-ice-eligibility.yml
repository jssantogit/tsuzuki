name: MangaAll ICE capability regression (PR #167)

on:
  push:
    branches:
      - tsuzuki/issue-166-mangaall-family
    paths:
      - 'domain/src/**'
      - '.github/workflows/mangaall-ice-eligibility.yml'

permissions:
  contents: read

jobs:
  evidence-without-reader-pages:
    name: Provisional ICE evidence does not require Reader pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Execute focused MangaAll ICE eligibility tests
        run: ./gradlew :domain:testDebugUnitTest --tests '*CollectProviderReadingEvidenceEligibilityTest'
