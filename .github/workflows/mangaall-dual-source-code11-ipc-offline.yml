name: MangaALL — two-source unsigned code11 native Android Binder IPC (OFFLINE)
# Executes REAL Android Host, isolated QuickJS + Binder and native 4341
# chapter snapshots. Source at exact SHA; no real network or publication.
on:
  push:
    branches: ['probe/mangaall-dual-source-scale30-*']
    paths:
      - '.github/workflows/mangaall-dual-source-code11-ipc-offline.yml'
      - '.github/scripts/mangaall_code11_dual_source_unsigned.py'
      - '.github/scripts/run_mangaall_dual_source_code11_ipc.sh'
      - 'app/src/androidTest/java/eu/kanade/tachiyomi/provider/runtime/MangaAllFutureRealDualSourceCode11InstrumentedTest.kt'

permissions:
  contents: read

concurrency:
  group: mangaall-dual-code11-ipc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-two-source-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax and scope guard before any package access
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/mangaall_code11_dual_source_unsigned.py
          bash -n .github/scripts/run_mangaall_dual_source_code11_ipc.sh
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/mangaall-dual-source-code11-ipc-offline.yml').read_text()
          import re
          assert re.search(r"(?m)^on:$", workflow)
          assert not re.search(r"(?m)^  (?:workflow_dispatch|pull_request):", workflow)
          assert "on:\n  push:" in workflow
          script=Path('.github/scripts/run_mangaall_dual_source_code11_ipc.sh').read_text()
          assert 'airplane-mode enable' in script
          assert 'MangaAllFutureRealDualSourceCode11InstrumentedTest' in script
          print('MANGAALL_DUAL_JS_CODE11|preflight=PASS|network=NOT_STARTED|signed=UNCHANGED')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jssantogit/providers-tsuzuki
          ref: 89b5979fff297c2a099359258c9f9249e0089db4
          path: future-code11-source
          persist-credentials: false
      - name: Verify original SHA and build ephemeral unsigned TWO-source ZIP
        run: |
          set -euo pipefail
          test "$(git -C future-code11-source rev-parse HEAD)" = '89b5979fff297c2a099359258c9f9249e0089db4'
          python3 .github/scripts/mangaall_code11_dual_source_unsigned.py \
            --source future-code11-source \
            --output app/src/androidTest/assets/mangaall-dual-source-code11-unsigned-research.zip
          test -s app/src/androidTest/assets/mangaall-dual-source-code11-unsigned-research.zip
          if git ls-files --error-unmatch app/src/androidTest/assets/mangaall-dual-source-code11-unsigned-research.zip >/dev/null 2>&1; then
            echo 'MANGAALL_DUAL_JS_CODE11|outcome=HARD_STOP|reason=TRACKED_RESEARCH_ASSET'
            exit 2
          fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Build Android Host app and AndroidTest with exact unsigned asset
        run: ./gradlew :app:spotlessKotlinCheck :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM for isolated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run two-source QuickJS Binder 4341 chapter continuation (NO NETWORK)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run_mangaall_dual_source_code11_ipc.sh
      - name: Retain sandbox test verdict only, never source bodies
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mangaall-dual-source-code11-real-android-ipc-offline
          path: .github/results/mangaall-dual-source-code11-ipc
          if-no-files-found: ignore
          retention-days: 2
