name: Reader Spotless patch (temporary PR only)

on:
  pull_request:
    branches:
      - 'tsuzuki/issue-176-zero-chapter-identity-20261102'

permissions:
  contents: read

jobs:
  report:
    name: Compute exact domain formatting patch without writing
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Shorten two overlong test names in disposable checkout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cases = [
              (
                  "domain/src/test/java/tachiyomi/domain/tsuzuki/provider/reading/CollectProviderReadingEvidenceTest.kt",
                  "source URL explicitly declaring fan colored cannot be auto bound as canonical base title",
                  "source fan colored URL blocks automatic base edition binding",
              ),
              (
                  "domain/src/test/java/tachiyomi/domain/tsuzuki/provider/reading/ResolveProviderChapterReadingTest.kt",
                  "source attested colored edition revokes stale automatic Reader binding but retains explicit user choice",
                  "source variant blocks automatic Reader but honors confirmed edition",
              ),
          ]
          for path, before, after in cases:
              file = Path(path)
              contents = file.read_text()
              assert before in contents
              file.write_text(contents.replace(before, after))
          PY
      - name: Apply canonical formatter in disposable checkout
        run: ./gradlew :domain:spotlessApply
      - name: Emit only JSON-escaped diff for review
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          patch = subprocess.check_output(
              ["git", "diff", "--", "domain/src/main", "domain/src/test"],
          ).decode("utf-8")
          print("TSUZUKI_SPOTLESS_PATCH_JSON=" + json.dumps(patch, ensure_ascii=True))
          PY
