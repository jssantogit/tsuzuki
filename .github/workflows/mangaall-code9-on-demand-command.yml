name: MangaAll code9 — on-demand GitHub comment command bridge

# Only exact, owner-authored command comments on the dedicated issue #230.
# This workflow itself does NOT query sources or build/install Android.
# It dispatches the existing manual-only canonical smoke workflow after a
# fail-closed server-side check of author, repo, issue, count, and title order.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  actions: write

concurrency:
  group: mangaall-code9-issue-command-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  validate-and-dispatch:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.repository == 'jssantogit/tsuzuki' &&
      github.event.issue.number == 230 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'jssantogit' &&
      github.event.comment.author_association == 'OWNER' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch dispatcher and canonical vector validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact owner comment and title vector before any Actions write
        id: command
        env:
          ORIGINAL_GITHUB_EVENT: ${{ github.event_path }}
          DISPATCH_PAYLOAD: ${{ runner.temp }}/mangaall-code9-on-demand-payload.json
        run: |
          set -euo pipefail
          python3 .github/scripts/mangaall_code9_smoke_comment_dispatch.py \
            "$ORIGINAL_GITHUB_EVENT" "$DISPATCH_PAYLOAD"
      - name: Start existing signed-code9 smoke ONLY when the owner comment explicitly says /mangaall-smoke
        if: steps.command.outputs.mode == 'smoke'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_PAYLOAD: ${{ runner.temp }}/mangaall-code9-on-demand-payload.json
        shell: bash
        run: |
          set -euo pipefail
          test -s "$DISPATCH_PAYLOAD"
          # The token is ephemeral and scoped to this trusted default-branch job.
          # No retry: an ambiguous remote response must NOT create duplicate runs.
          http_code="$(curl --silent --show-error --max-time 20 \
            --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @"$DISPATCH_PAYLOAD" \
            'https://api.github.com/repos/jssantogit/tsuzuki/actions/workflows/mangaall-code9-canonical-smoke.yml/dispatches')"
          if [ "$http_code" != 204 ]; then
            echo 'MANGAALL_ON_DEMAND_DISPATCH|outcome=FAIL|reason=GITHUB_WORKFLOW_DISPATCH_REJECTED'
            exit 1
          fi
          echo 'MANGAALL_ON_DEMAND_DISPATCH|outcome=ACCEPTED|workflow=SIGNED_CODE9_CANONICAL_SMOKE|source=OWNER_COMMENT'
      - name: Offline plan-only command never dispatches or contacts upstream
        if: steps.command.outputs.mode == 'plan'
        run: echo 'MANGAALL_ON_DEMAND_DISPATCH|outcome=DRY_RUN_ONLY|upstream=NONE|workflowDispatch=NONE'
