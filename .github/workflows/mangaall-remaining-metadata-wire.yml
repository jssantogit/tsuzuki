name: MangaALL — remaining metadata wire diagnostics (NO READER)
on:
  push:
    branches: ['probe/mangaall-dual-source-scale30-*']
    paths:
      - '.github/workflows/mangaall-remaining-metadata-wire.yml'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        scope: [dot, catalog]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bounded public metadata shapes, no raw bodies or IDs
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/observe_mangaall_remaining_metadata.py
          python3 .github/scripts/observe_mangaall_remaining_metadata.py selftest
          python3 .github/scripts/observe_mangaall_remaining_metadata.py ${{ matrix.scope }}
