name: MangaAll signed code8 — unified three-source Android live manga batch

# Pull requests only compile and run offline tests. Actual CDN traffic is
# opt-in via workflow_dispatch or a manifest-changing commit on a dedicated
# mangaall-live/* branch; ordinary commits to main never execute LIVE.
on:
  pull_request:
    paths:
      - '.github/workflows/mangaall-live-page-android.yml'
      - '.github/scripts/run_mangaall_live_pages_android.sh'
      - '.github/scripts/mangaall_live_batch.py'
      - '.github/scripts/test_mangaall_live_batch.py'
      - '.github/mangaall-live-batch.json'
      - 'app/src/androidTest/java/eu/kanade/tachiyomi/provider/reading/ScriptProviderReadingGatewayIsolationTest.kt'
      - 'app/src/androidTest/java/eu/kanade/tachiyomi/data/tsuzuki/instrumentation/MangaAllReaderJourneyFixture.kt'
      - 'app/src/androidTest/java/eu/kanade/tachiyomi/data/tsuzuki/instrumentation/CanonicalReaderSourceSwitchInstrumentedTest.kt'
  push:
    branches:
      - 'mangaall-live/**'
    paths:
      - '.github/mangaall-live-batch.json'
  workflow_dispatch:
    inputs:
      titles:
        description: 'MangaAll unified: ordered titles (all 3 sources; English facet)'
        required: true
        type: string
      gate_mode:
        description: 'transport: CDN decode only; reader: real CDN pixels in ReaderActivity'
        required: true
        default: reader
        type: choice
        options:
          - transport
          - reader

permissions:
  contents: read

concurrency:
  group: mangaall-live-android-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify batch parser, ordering, fail-closed semantics and shell syntax
        run: |
          bash -n .github/scripts/run_mangaall_live_pages_android.sh
          python3 .github/scripts/test_mangaall_live_batch.py
          GITHUB_EVENT_NAME=push GITHUB_REF=refs/heads/mangaall-live/contract python3 .github/scripts/mangaall_live_batch.py --check-plan
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Compile Android probe without executing live traffic
        run: ./gradlew :app:spotlessKotlinCheck :app:assembleDebugAndroidTest

  live-android-page-decoder:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/mangaall-live/'))
    name: Unified code8 lookup -> 3-source audit -> source Reader gates
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MANGAALL_BATCH_TITLES: ${{ inputs.titles || '' }}
      MANGAALL_BATCH_LANGUAGE: en
      MANGAALL_BATCH_MODE: ${{ inputs.gate_mode || 'reader' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tri-source English audit, ordered titles and case limits (offline)
        run: |
          python3 .github/scripts/test_mangaall_live_batch.py
          python3 .github/scripts/mangaall_live_batch.py --check-plan
      - name: Checkout immutable published code8 source, read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jssantogit/providers-tsuzuki
          ref: 99f3565a1e1edc0d8ed249b7597006c897f02636
          path: signed-mangaall
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published root/code8 bytes and stage original archive for AndroidTest
        working-directory: signed-mangaall
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 99f3565a1e1edc0d8ed249b7597006c897f02636
          node tooling/verify_index.mjs
          python3 - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path
          root = Path('.')
          payload = json.loads((root / 'dist/index.payload.json').read_text())
          assert payload['repositoryId'] == 'app.tsuzuki.providers'
          assert payload['sequence'] == 34
          matches = [x for x in payload['providers'] if x['providerId'] == 'app.tsuzuki.mangaall']
          assert len(matches) == 1 and matches[0]['versionCode'] == 8
          source = root / 'dist/providers/app.tsuzuki.mangaall-8.tsz'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == matches[0]['sha256']
          dest = Path('../app/src/androidTest/assets/mangaall/code8-published-package.tsz')
          dest.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, dest)
          print('MANGAALL_ANDROID_LIVE_PACKAGE|provenance=OFFICIAL_SIGNED_CODE8|root=VERIFIED')
          PY
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Compile original code8 live page probe
        run: |
          bash -n .github/scripts/run_mangaall_live_pages_android.sh
          ./gradlew :app:spotlessKotlinCheck :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM for disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run each manga through the unified three-source Android gate
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 .github/scripts/mangaall_live_batch.py
      - name: Save per-title and per-source closed audit (no IDs, URLs or images)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mangaall-live-android-batch-summary
          path: .github/results/mangaall-live-pages-android/summary.json
          if-no-files-found: warn
          retention-days: 3
