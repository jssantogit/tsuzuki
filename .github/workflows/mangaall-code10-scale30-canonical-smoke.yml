name: MangaALL signed code10 — 30-work sharded canonical/SQLite evidence (ON DEMAND)
# This is NOT invoked by PRs or ordinary commits. A separate explicit
# operator authorization is required to send real 30-title source/catalog
# requests. Original P-256 signed code10 remains immutable.
on:
  push:
    branches: ['probe/mangaall-code10-scale30-*']
    paths:
      - '.github/mangaall-code10-scale30-request.json'
  workflow_dispatch:
    inputs:
      works:
        description: 'EXACTLY 30 named works, one per line, optionally manga :: Title'
        required: true
        type: string
      acknowledge:
        description: 'Type I_ACCEPT_SIGNED_CODE10_SCALE30_LIVE to authorize bounded external metadata requests'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mangaall-code10-canonical-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    outputs:
      works: ${{ steps.approve.outputs.works }}
    name: Validate vector, tier, order and manual consent WITHOUT NETWORK
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test isolated/scale preflight (offline)
        run: |
          python3 .github/scripts/test_mangaall_code10_canonical_smoke_plan.py
          python3 .github/scripts/test_mangaall_code10_canonical_smoke_report.py
          python3 .github/scripts/test_mangaall_30_host_readiness.py
          python3 .github/scripts/test_mangaall_code10_scale30_aggregate.py
      - name: Read exactly scoped operator or one-shot commit request WITHOUT NETWORK
        id: request
        env:
          MANGAALL_SCALE30_EVENT: ${{ github.event_name }}
          MANGAALL_SCALE30_MANUAL_WORKS: ${{ inputs.works }}
          MANGAALL_SCALE30_MANUAL_ACK: ${{ inputs.acknowledge }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, uuid
          import sys
          sys.path.insert(0, '.github/scripts')
          from mangaall_code10_canonical_smoke_plan import parse_plan
          if os.environ['MANGAALL_SCALE30_EVENT'] == 'push':
              ref=os.environ['GITHUB_REF']
              assert re.fullmatch(r'refs/heads/probe/mangaall-code10-scale30-[a-z0-9-]{1,70}', ref), 'Invalid scale30 probe branch'
              path=pathlib.Path('.github/mangaall-code10-scale30-request.json')
              raw=path.read_bytes()
              assert len(raw)<=9000, 'Oversized scale30 commit request'
              request=json.loads(raw)
              assert type(request) is dict and set(request)=={'works','acknowledge'}, 'Unknown request keys'
              works, acknowledgement=request['works'], request['acknowledge']
          elif os.environ['MANGAALL_SCALE30_EVENT'] == 'workflow_dispatch':
              works=os.environ['MANGAALL_SCALE30_MANUAL_WORKS']
              acknowledgement=os.environ['MANGAALL_SCALE30_MANUAL_ACK']
          else:
              raise ValueError('Only manual or scoped one-shot commit can launch source traffic')
          assert acknowledgement=='I_ACCEPT_SIGNED_CODE10_SCALE30_LIVE', 'Explicit scale30 authorization required'
          assert isinstance(works,str), 'Invalid work vector'
          assert len(parse_plan(
              works, 'scale', 'I_ACCEPT_CODE10_CANONICAL_SMOKE',
          ))==30, 'Exactly 30 individually validated works required'
          end='END_'+uuid.uuid4().hex
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'works<<{end}\n{works.rstrip(chr(10))}\n{end}\n')
              out.write('acknowledge=I_ACCEPT_SIGNED_CODE10_SCALE30_LIVE\n')
          print('MANGAALL_SCALE30_REQUEST|source=EXPLICIT_OPERATOR|works=30|internalSources=3|network=NOT_STARTED')
          PY
      - name: Fail closed before external traffic unless acknowledged and count verified
        id: approve
        env:
          MANGAALL_SCALE30_ACK: ${{ steps.request.outputs.acknowledge }}
          MANGAALL_WORKS: ${{ steps.request.outputs.works }}
          MANGAALL_SMOKE_TIER: scale
          MANGAALL_SMOKE_ACK: I_ACCEPT_CODE10_CANONICAL_SMOKE
        run: |
          set -euo pipefail
          test "$MANGAALL_SCALE30_ACK" = 'I_ACCEPT_SIGNED_CODE10_SCALE30_LIVE'
          python3 .github/scripts/mangaall_30_host_readiness.py --plan
          python3 - <<'PY'
          import os, uuid
          original=os.environ['MANGAALL_WORKS'].rstrip('\n')
          end='EOF_'+uuid.uuid4().hex
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'works<<{end}\n{original}\n{end}\n')
          print('MANGAALL_SCALE30_NETWORK_PLAN|titles=30|shards=3|perShard=10|signedCode10=UNCHANGED|catalog=INDEPENDENT|readerPixels=NOT_PROVEN')
          PY

  real-provider-to-host-decoder:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      MANGAALL_WORKS: ${{ needs.plan.outputs.works }}
      MANGAALL_SHARD_INDEX: ${{ matrix.shard }}
      MANGAALL_SHARD_COUNT: '3'
    needs: plan
    name: Real signed code10 V1 source capture then production Host Kotlin V1 replay
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout current production Host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout immutable current P-256 signed code10 Provider source (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jssantogit/providers-tsuzuki
          ref: ab97ebdaeb2a2130fe57b8c349908836a1d17708
          path: mangaall-signed-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify signed repository root, package SHA and exact live JavaScript bytes
        working-directory: mangaall-signed-source
        shell: bash
        run: |
          set -euo pipefail
          node tooling/verify_index.mjs
          python3 tooling/build_provider.py providers/mangaall /tmp/mangaall-host-source.tsz
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          data=json.loads(Path('dist/index.payload.json').read_text())
          assert data['repositoryId']=='app.tsuzuki.providers' and data['sequence']==36
          items=[x for x in data['providers'] if x['providerId']=='app.tsuzuki.mangaall']
          assert len(items)==1 and items[0]['versionCode']==10 and items[0]['versionName']=='0.5.5'
          assert items[0]['sha256']=='bcdfd03ac18c3cfdd0517e08b58dde7efa1f5baa874e93002af28e518860f95f'
          digest=items[0]['sha256']
          assert hashlib.sha256(Path('/tmp/mangaall-host-source.tsz').read_bytes()).hexdigest()==digest
          assert hashlib.sha256(Path('dist/providers/app.tsuzuki.mangaall-10.tsz').read_bytes()).hexdigest()==digest
          print('MANGAALL_CODE10_CANONICAL_SMOKE|source=P256_SIGNED|code=10|sequence=36|archive=REVIEWED_EXACT|authority=NO_EDITORIAL_BINDING')
          PY
      - name: Check Provider input agrees with ordered Host vector (offline)
        working-directory: mangaall-signed-source
        env:
          MANGAALL_SUITE: custom
          MANGAALL_SIGNED_CODE10_CANONICAL_SMOKE: I_ACCEPT_SIGNED_CODE10_CANONICAL_SMOKE
          MANGAALL_BATCH: '1'
          MANGAALL_WORKS: ${{ needs.plan.outputs.works }}
          MANGAALL_SHARD_INDEX: ${{ matrix.shard }}
          MANGAALL_SHARD_COUNT: '3'
        run: |
          # Verify the 8-page Host capture bound before a single upstream GET.
          # This is the immutable, signed-code10 source checkout tooling only.
          node tooling/test_mangaall_live_journey.mjs
          node tooling/mangaall_live_matrix.mjs --plan
      - name: Fetch authentic signed code10 V1 lookup/chapter envelopes (one three-source lookup per title)
        working-directory: mangaall-signed-source
        env:
          MANGAALL_SUITE: custom
          MANGAALL_SIGNED_CODE10_CANONICAL_SMOKE: I_ACCEPT_SIGNED_CODE10_CANONICAL_SMOKE
          MANGAALL_BATCH: '1'
          MANGAALL_WORKS: ${{ needs.plan.outputs.works }}
          MANGAALL_SHARD_INDEX: ${{ matrix.shard }}
          MANGAALL_SHARD_COUNT: '3'
        run: |
          node tooling/mangaall_live_matrix.mjs --live \
            --output mangaall-live-matrix-${{ matrix.shard }}.json \
            --real-envelopes mangaall-real-envelopes-${{ matrix.shard }}.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Decode signed code10 source envelopes through production Host V1 gateway
        env:
          MANGAALL_REAL_REPLAY_REQUIRED: '1'
          MANGAALL_REAL_ENVELOPES_FILE: ${{ github.workspace }}/mangaall-signed-source/mangaall-real-envelopes-${{ matrix.shard }}.json
          MANGAALL_SIGNED_PACKAGE_FILE: ${{ github.workspace }}/mangaall-signed-source/dist/providers/app.tsuzuki.mangaall-10.tsz
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests eu.kanade.tachiyomi.provider.reading.MangaAllRealSourceHostDecoderTest
      - name: Preserve bounded real source and Host decoder verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangaall-real-host-decoder-${{ matrix.shard }}
          path: |
            mangaall-signed-source/mangaall-live-matrix-*.json
            mangaall-signed-source/mangaall-real-envelopes-*.json
            app/build/test-results/testDebugUnitTest/TEST-eu.kanade.tachiyomi.provider.reading.MangaAllRealSourceHostDecoderTest.xml
          if-no-files-found: warn
          retention-days: 3


  independent-catalog-android:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      MANGAALL_WORKS: ${{ needs.plan.outputs.works }}
      MANGAALL_SHARD_INDEX: ${{ matrix.shard }}
      MANGAALL_SHARD_COUNT: '3'
    needs: plan
    name: Independent real MangaUpdates catalog / Android (same ordered titles)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout production Host and test-only live catalog runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Validate script and compile disposable debug host plus instrumentation
        run: |
          bash -n .github/scripts/run_mangaall_live_catalog_android.sh
          ./gradlew :app:spotlessKotlinCheck :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM on GitHub-hosted emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Query independent catalog through production Tsuzuki integration, not MangaAll
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          MANGAALL_WORKS: ${{ needs.plan.outputs.works }}
          MANGAALL_SHARD_INDEX: ${{ matrix.shard }}
          MANGAALL_SHARD_COUNT: '3'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run_mangaall_live_catalog_android.sh
      - name: Keep only sanitized independent catalog identity results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangaall-live-catalog-${{ matrix.shard }}
          path: .github/results/mangaall-live-catalog-*/
          if-no-files-found: warn
          retention-days: 3


  canonical-collector-real-replay:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      MANGAALL_WORKS: ${{ needs.plan.outputs.works }}
      MANGAALL_SHARD_INDEX: ${{ matrix.shard }}
      MANGAALL_SHARD_COUNT: '3'
    name: Real independent catalog + code10 signed source → canonical collector + SQLite
    needs: [plan, real-provider-to-host-decoder, independent-catalog-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout Host canonical engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout immutable official signed MangaAll code10 archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jssantogit/providers-tsuzuki
          ref: ab97ebdaeb2a2130fe57b8c349908836a1d17708
          path: signed-mangaall
          persist-credentials: false
      - name: Retrieve original real-source envelopes from matching shard
        uses: actions/download-artifact@v4
        with:
          name: mangaall-real-host-decoder-${{ matrix.shard }}
          path: real-source
      - name: Retrieve independently observed Android catalog proof
        uses: actions/download-artifact@v4
        with:
          name: mangaall-live-catalog-${{ matrix.shard }}
          path: real-catalog
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Verify matching source/canonical artifacts and exact code10 signed package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t sources < <(find real-source -type f -name 'mangaall-real-envelopes-${{ matrix.shard }}.json')
          mapfile -t catalogs < <(find real-catalog -type f -name 'catalog-attestations.json')
          test "${#sources[@]}" = 1
          test "${#catalogs[@]}" = 1
          test -s "${sources[0]}"
          test -s "${catalogs[0]}"
          test -s signed-mangaall/dist/providers/app.tsuzuki.mangaall-10.tsz
          printf 'MANGAALL_REAL_ENVELOPES_FILE=%s/%s\n' "$PWD" "${sources[0]}" >> "$GITHUB_ENV"
          printf 'MANGAALL_REAL_CATALOG_FILE=%s/%s\n' "$PWD" "${catalogs[0]}" >> "$GITHUB_ENV"
          printf 'MANGAALL_SIGNED_PACKAGE_FILE=%s/signed-mangaall/dist/providers/app.tsuzuki.mangaall-10.tsz\n' \
            "$PWD" >> "$GITHUB_ENV"
      - name: Real Kotlin collector, RefreshChapterEvidence, ReconcileChapterEvidence and SQLite/JDBC (never auto-bind partial results)
        env:
          MANGAALL_CANONICAL_COLLECT_REQUIRED: '1'
          MANGAALL_REAL_SQLITE_REQUIRED: '1'
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests eu.kanade.tachiyomi.provider.reading.MangaAllRealCanonicalCollectorTest \
            --tests eu.kanade.tachiyomi.provider.reading.MangaAllRealSqliteRefreshTest
      - name: Correlate signed code10 sources, independent catalog, real Kotlin collector and SQLite by original work ID hash
        env:
          MANGAALL_WORKS: ${{ needs.plan.outputs.works }}
          MANGAALL_SMOKE_TIER: scale
        run: |
          set -euo pipefail
          mapfile -t matrices < <(find real-source -type f -name 'mangaall-live-matrix-${{ matrix.shard }}.json')
          mapfile -t source_cases < <(find real-source -type f -name 'mangaall-real-envelopes-${{ matrix.shard }}.json')
          mapfile -t catalog_cases < <(find real-catalog -type f -name 'catalog-attestations.json')
          mapfile -t decoder_xmls < <(find real-source -type f -name 'TEST-eu.kanade.tachiyomi.provider.reading.MangaAllRealSourceHostDecoderTest.xml')
          test "${#matrices[@]}" = 1
          test "${#source_cases[@]}" = 1
          test "${#catalog_cases[@]}" = 1
          test "${#decoder_xmls[@]}" = 1
          python3 .github/scripts/mangaall_code10_canonical_smoke_report.py \
            "${source_cases[0]}" "${matrices[0]}" "${catalog_cases[0]}" \
            app/build/test-results/testDebugUnitTest/TEST-eu.kanade.tachiyomi.provider.reading.MangaAllRealCanonicalCollectorTest.xml \
            app/build/test-results/testDebugUnitTest/TEST-eu.kanade.tachiyomi.provider.reading.MangaAllRealSqliteRefreshTest.xml \
            "${decoder_xmls[0]}" \
            .github/results/mangaall-code10-canonical-smoke/summary-${{ matrix.shard }}.json
      - name: Retain only sanitized per-work canonical smoke verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangaall-code10-canonical-smoke-per-work-summary-${{ matrix.shard }}
          path: .github/results/mangaall-code10-canonical-smoke/summary-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve Host SQLDelight and source verdicts without claiming Reader pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangaall-canonical-collector-replay-${{ matrix.shard }}
          path: |
            app/build/test-results/testDebugUnitTest/TEST-eu.kanade.tachiyomi.provider.reading.MangaAllRealCanonicalCollectorTest.xml
            app/build/test-results/testDebugUnitTest/TEST-eu.kanade.tachiyomi.provider.reading.MangaAllRealSqliteRefreshTest.xml
          if-no-files-found: warn
          retention-days: 3


  aggregate-exact-30:
    name: Correlate every original signed-code10 shard; reject missing or substituted work
    needs: [plan, canonical-collector-real-replay]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MANGAALL_WORKS: ${{ needs.plan.outputs.works }}
      MANGAALL_SMOKE_ACK: I_ACCEPT_CODE10_CANONICAL_SMOKE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download authentic 3 Host correlation shards; never synthesize a missing shard
        uses: actions/download-artifact@v4
        with:
          pattern: mangaall-code10-canonical-smoke-per-work-summary-*
          path: .github/results/mangaall-scale30-shards
      - name: Validate 30 global case IDs, all three source/Host/SQLite shards and no fake Reader PASS
        run: |
          set -euo pipefail
          python3 .github/scripts/test_mangaall_code10_scale30_aggregate.py
          mapfile -t summaries < <(find .github/results/mangaall-scale30-shards -type f -name 'summary-*.json' | sort)
          test "${#summaries[@]}" = 3
          python3 .github/scripts/mangaall_code10_scale30_aggregate.py \
            "${summaries[0]}" "${summaries[1]}" "${summaries[2]}" \
            .github/results/mangaall-scale30/aggregate.json
      - name: Preserve only closed 30-work evidence with explicit Reader limitation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangaall-code10-scale30-aggregate
          path: .github/results/mangaall-scale30/aggregate.json
          if-no-files-found: warn
          retention-days: 7

  reader-ui-regression:
    name: ReaderActivity source navigation and chapter regression — synthetic offline ONLY
    needs: [aggregate-exact-30]
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify offline Reader regression harness shell contract
        run: bash -n .github/scripts/run_canonical_v2_android.sh
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Compile production ReaderActivity and isolated instrumentation
        run: ./gradlew :app:spotlessKotlinCheck :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM for disposable Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual ReaderActivity canonical source-switch regression, OFFLINE
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run_canonical_v2_android.sh
      - name: Preserve status-only synthetic Reader regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangaall-code10-smoke-reader-ui-SYNTHETIC-only
          path: .github/results/canonical-v2-android/**
          if-no-files-found: ignore
          retention-days: 3
      - name: Explicit Reader limitations
        run: echo 'MANGAALL_CODE10_SMOKE_READER|readerUi=SYNTHETIC_REGRESSION|sourceHttp=NOT_FROM_CAPTURE|cdnPixels=NOT_TESTED|canonicalBinding=NOT_AUTO_GRANTED'
