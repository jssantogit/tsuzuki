name: Provider Advanced Extraction — integrated Android gate (controlled)
on:
  push:
    branches: ['feat/provider-platform-v2-advanced-extraction']
    paths: ['.github/provider-advanced-extraction-gate.request']
permissions:
  contents: read
jobs:
  controlled-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify explicit controlled-only request
        run: test "$(cat .github/provider-advanced-extraction-gate.request)" = OFFLINE_CONTROLLED_ONLY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jssantogit/providers-tsuzuki
          ref: 89b5979fff297c2a099359258c9f9249e0089db4
          path: advanced-source
          persist-credentials: false
      - name: Prepare two transient unsigned fixture packages
        run: python3 .github/scripts/build_advanced_extraction_fixtures.py advanced-source
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Compile the integrated Host and instrumentation
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run exactly one Android acceptance test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run_provider_advanced_extraction_gate.sh
