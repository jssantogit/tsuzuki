name: MangaAll Reader HTTP response regression

on:
  push:
    branches:
      - tsuzuki/issue-166-mangaall-family
    paths:
      - 'app/src/main/java/eu/kanade/tachiyomi/ui/reader/loader/ProviderHttpPageLoader.kt'
      - 'app/src/test/java/eu/kanade/tachiyomi/ui/reader/loader/ProviderHttpPageLoaderTest.kt'
      - '.github/workflows/mangaall-reader-response-gate.yml'

permissions:
  contents: read

jobs:
  reader-response:
    name: Provider Reader HTML-200 guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Run focused HTTP page regression
        run: ./gradlew :app:testDebugUnitTest --tests '*ProviderHttpPageLoaderTest'
