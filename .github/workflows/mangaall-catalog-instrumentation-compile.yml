name: MangaAll independent catalog Android instrumentation compile

# Compile-only guard for the live Host catalog probe. No external requests,
# emulator, APK publication or claims of canonical reconciliation.
on:
  pull_request:
    paths:
      - '.github/workflows/mangaall-real-host-decoder.yml'
      - '.github/workflows/mangaall-catalog-instrumentation-compile.yml'
      - '.github/scripts/run_mangaall_live_catalog_android.sh'
      - '.github/scripts/validate_mangaall_catalog_attestation.py'
      - '.github/scripts/test_validate_mangaall_catalog_attestation.py'
      - '.github/scripts/run_mangaall_live_reader_android.sh'
      - '.github/scripts/validate_mangaall_live_reader.py'
      - '.github/scripts/test_validate_mangaall_live_reader.py'
      - 'app/src/androidTest/java/eu/kanade/tachiyomi/data/tsuzuki/instrumentation/MangaAllIndependentCatalogLiveInstrumentedTest.kt'
      - 'app/src/androidTest/java/eu/kanade/tachiyomi/data/tsuzuki/instrumentation/MangaAllLive*.kt'
      - 'app/src/test/java/eu/kanade/tachiyomi/provider/reading/MangaAll*.kt'
      - 'domain/src/main/java/tachiyomi/domain/tsuzuki/catalog/interactor/ResolveMangaAllIndependentCatalogIdentity.kt'
      - 'domain/src/main/java/tachiyomi/domain/tsuzuki/catalog/interactor/MangaAllCatalogCanonicalMetadata.kt'
      - 'domain/src/test/java/tachiyomi/domain/tsuzuki/catalog/interactor/MangaAllCatalogCanonicalMetadataTest.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mangaall-catalog-android-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-test-compilation:
    name: Kotlin AndroidTest compile and safe runner shell
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Validate opt-in Android runner shell and Kotlin format
        run: |
          bash -n .github/scripts/run_mangaall_live_catalog_android.sh
          bash -n .github/scripts/run_mangaall_live_reader_android.sh
          ./gradlew :app:spotlessKotlinCheck :domain:spotlessKotlinCheck
      - name: Verify independent catalog resolver contract on this exact revision
        run: |
          ./gradlew :domain:testDebugUnitTest \
            --tests tachiyomi.domain.tsuzuki.catalog.interactor.ResolveMangaAllIndependentCatalogIdentityTest
      - name: Verify real catalog artifact sanitization without network or created candidates
        run: python3 -m unittest discover -s .github/scripts -p 'test_validate_mangaall_catalog_attestation.py'
      - name: Verify live Reader pixel attestations reject fake and missing results
        run: python3 -m unittest discover -s .github/scripts -p 'test_validate_mangaall_live_reader.py'
      - name: Verify independent identity to canonical metadata provenance
        run: |
          ./gradlew :domain:testDebugUnitTest \
            --tests tachiyomi.domain.tsuzuki.catalog.interactor.MangaAllCatalogCanonicalMetadataTest
      - name: Verify Host catalog proof parser and source replay contract
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests eu.kanade.tachiyomi.provider.reading.MangaAllLiveCatalogAttestationsTest \
            --tests eu.kanade.tachiyomi.provider.reading.MangaAllCapturedRequestTapeTest \
            --tests eu.kanade.tachiyomi.provider.reading.MangaAllRealSourceHostDecoderTest \
            --tests eu.kanade.tachiyomi.provider.reading.MangaAllCanonicalCapturedReplayCoverageTest \
            --tests eu.kanade.tachiyomi.provider.reading.MangaAllSqliteRefreshPolicyTest \
            --tests eu.kanade.tachiyomi.provider.reading.MangaAllRealSqliteRefreshTest \
            --tests eu.kanade.tachiyomi.provider.reading.MangaAllReaderSqliteProbeTest \
            --tests eu.kanade.tachiyomi.provider.reading.MangaAllSqliteReaderPolicyTest
      - name: Compile production debug Host and live catalog instrumented test
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
