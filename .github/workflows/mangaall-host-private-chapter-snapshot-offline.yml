name: MangaALL — future Host-private chapter snapshot Kotlin gate (OFFLINE)

# NONSHIPPING: no live traffic, no release, no signed Provider changes.
on:
  push:
    branches:
      - 'feat/mangaall-host-private-chapter-snapshot-*'
    paths:
      - 'core/common/build.gradle.kts'
      - 'core/common/src/main/kotlin/tachiyomi/core/provider/runtime/MangaAllFutureHostChapterSnapshot.kt'
      - 'core/common/src/test/kotlin/tachiyomi/core/provider/runtime/MangaAllFutureHostChapterSnapshotTest.kt'
      - '.github/workflows/mangaall-host-private-chapter-snapshot-offline.yml'
  pull_request:
    paths:
      - 'core/common/build.gradle.kts'
      - 'core/common/src/main/kotlin/tachiyomi/core/provider/runtime/MangaAllFutureHostChapterSnapshot.kt'
      - 'core/common/src/test/kotlin/tachiyomi/core/provider/runtime/MangaAllFutureHostChapterSnapshotTest.kt'
      - '.github/workflows/mangaall-host-private-chapter-snapshot-offline.yml'

permissions:
  contents: read
concurrency:
  group: mangaall-future-private-host-snapshot
  cancel-in-progress: true
jobs:
  kotlin-private-host-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify no production or signed release paths were changed
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          test -n "$base"
          git diff --name-only "$base" HEAD | tee /tmp/mangaall-host-snapshot-changed.txt
          if grep -E '^(providers/|dist/|app/src/|core/common/src/main/kotlin/tachiyomi/core/provider/runtime/(ProviderQuickJsRuntime|ProviderScriptPackageRuntime|ProviderHttpProtocol|ProviderHttpHostService)\.kt)' /tmp/mangaall-host-snapshot-changed.txt; then
            echo "::error::Signed Provider or production Host API touched by offline snapshot gate"
            exit 1
          fi
          echo 'MANGAALL_HOST_PRIVATE_SNAPSHOT|signed_code10=UNCHANGED|quickjs_bindings=UNCHANGED|network=NONE'
      - name: Generate exact repo Kotlin formatting patch for review
        shell: bash
        run: |
          ./gradlew :core:common:spotlessKotlinApply --stacktrace
          echo 'MANGAALL_FORMAT_PATCH_BEGIN'
          git diff -- core/common/src/main/kotlin/tachiyomi/core/provider/runtime/MangaAllFutureHostChapterSnapshot.kt core/common/src/test/kotlin/tachiyomi/core/provider/runtime/MangaAllFutureHostChapterSnapshotTest.kt
          echo 'MANGAALL_FORMAT_PATCH_END'
      - name: Kotlin formatting
        run: ./gradlew :core:common:spotlessKotlinCheck --stacktrace
      - name: Full private snapshot capacity regression on JVM
        run: ./gradlew :core:common:testDebugUnitTest --tests 'tachiyomi.core.provider.runtime.MangaAllFutureHostChapterSnapshotTest' --stacktrace
