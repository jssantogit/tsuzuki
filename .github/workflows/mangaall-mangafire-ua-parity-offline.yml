name: MangaALL — MangaFire HTTP / Chromium User-Agent parity (OFFLINE)

# This is a transport identity contract, not a challenge solver or source smoke.
# No request to MangaFire is sent. Do not infer verified catalogue data.
on:
  push:
    branches: ['fix/mangaall-mangafire-http-webview-ua-*']
    paths:
      - '.github/workflows/mangaall-mangafire-ua-parity-offline.yml'
      - '.github/scripts/run_mangaall_mangafire_ua_parity_offline.sh'
      - 'app/src/main/java/eu/kanade/tachiyomi/provider/runtime/ProviderHostInvocation.kt'
      - 'app/src/main/java/eu/kanade/tachiyomi/provider/runtime/MangaAllMangaFireUserAgent.kt'
      - 'app/src/test/java/eu/kanade/tachiyomi/provider/runtime/MangaAllMangaFireUserAgentTest.kt'
      - 'app/src/androidTest/java/eu/kanade/tachiyomi/provider/runtime/MangaAllMangaFireUserAgentInstrumentationTest.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mangaall-mangafire-ua-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-http-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Verify Kotlin formatting and scoped unit contract
        run: |
          ./gradlew :app:spotlessKotlinCheck
          ./gradlew :app:testDebugUnitTest --tests eu.kanade.tachiyomi.provider.runtime.MangaAllMangaFireUserAgentTest
      - name: Assemble real Android debug and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM for offline emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual Android Chromium UA against request header without source traffic
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run_mangaall_mangafire_ua_parity_offline.sh
