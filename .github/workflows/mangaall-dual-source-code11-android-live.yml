name: MangaALL — unsigned two-source code11 REAL Android Host chapters (OPT-IN)
# Real GitHub-hosted Android emulator, pinned code11 research ZIP, MangaDot Bleach
# chapter snapshot across isolated QuickJS Binder invocations. Not a 30-work
# reader/canonical validation. No signing, merging or publishing.
on:
  push:
    branches: ['probe/mangaall-dual-source-scale30-*']
    paths:
      - '.github/workflows/mangaall-dual-source-code11-android-live.yml'

permissions:
  contents: read

concurrency:
  group: mangaall-code11-android-live-two-source
  cancel-in-progress: false

jobs:
  exact-unsigned-source-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Require exact opt-in workflow-only commit and emulation-safe syntax
        run: |
          set -euo pipefail
          bash -n .github/scripts/run_mangaall_dual_source_code11_android_live.sh
          python3 -m py_compile .github/scripts/mangaall_code11_dual_source_unsigned.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files=subprocess.check_output(
              ["git","diff-tree","--no-commit-id","--name-only","-r","HEAD"],
              text=True
          ).splitlines()
          assert files==[".github/workflows/mangaall-dual-source-code11-android-live.yml"], files
          script=Path(".github/scripts/run_mangaall_dual_source_code11_android_live.sh").read_text()
          workflow=Path(".github/workflows/mangaall-dual-source-code11-android-live.yml").read_text()
          assert "I_ACCEPT_MANGAALL_TWO_SOURCE_CODE11_ANDROID_LIVE" in script
          assert "MangaAllFutureRealDualSourceCode11LiveInstrumentedTest" in script
          assert "airplane-mode disable" in script
          import re
          assert re.search(r"(?m)^on:$", workflow)
          assert re.search(r"(?m)^  push:$", workflow)
          assert not re.search(r"(?m)^  workflow_dispatch:", workflow)
          assert "actions/upload-artifact@" in workflow
          print("MANGAALL_DUAL_ANDROID_LIVE|optIn=EXACT_COMMIT|source=UNSIGNED_CODE11|emulator=REQUIRED|signed=UNCHANGED")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jssantogit/providers-tsuzuki
          ref: 89b5979fff297c2a099359258c9f9249e0089db4
          path: future-code11-source
          persist-credentials: false
      - name: Verify pinned module source and create temporary research-only ZIP
        run: |
          set -euo pipefail
          test "$(git -C future-code11-source rev-parse HEAD)" = '89b5979fff297c2a099359258c9f9249e0089db4'
          python3 .github/scripts/mangaall_code11_dual_source_unsigned.py \
            --source future-code11-source \
            --output app/src/androidTest/assets/mangaall-dual-source-code11-unsigned-research.zip
          test -s app/src/androidTest/assets/mangaall-dual-source-code11-unsigned-research.zip
          ! git ls-files --error-unmatch app/src/androidTest/assets/mangaall-dual-source-code11-unsigned-research.zip
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Compile unsigned research Android Host and instrumentation
        run: ./gradlew :app:spotlessKotlinCheck :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM for GitHub-hosted Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real MangaDot 4341-capable native snapshot over Android QuickJS Binder
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run_mangaall_dual_source_code11_android_live.sh
      - name: Preserve sanitized verdict, never source data or runtime logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mangaall-dual-source-code11-android-live-verdict
          path: .github/results/mangaall-dual-source-code11-android-live/verdict.txt
          if-no-files-found: ignore
          retention-days: 2
