name: MangaALL — future manifest-gated Host chapter snapshots (OFFLINE)
# Research-only permission gate, no code11 release or code10 manifest edits.
on:
  push:
    branches: ['feat/mangaall-host-large-chapter-grant-code11-only-*']
    paths:
      - 'core/common/src/main/kotlin/tachiyomi/core/provider/**'
      - 'core/common/src/test/kotlin/tachiyomi/core/provider/**'
      - '.github/workflows/mangaall-future-host-grant-offline.yml'
  pull_request:
    paths:
      - 'core/common/src/main/kotlin/tachiyomi/core/provider/**'
      - 'core/common/src/test/kotlin/tachiyomi/core/provider/**'
      - '.github/workflows/mangaall-future-host-grant-offline.yml'
permissions:
  contents: read
concurrency:
  group: mangaall-future-grant-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  manifest-and-host-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Restrict review to future Host, separately gated Binder and parser scope
        shell: bash
        env:
          GITHUB_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          git diff --name-only "$base" HEAD | tee /tmp/mangaall-future-host-changed.txt
          if grep -E '^(providers/|dist/|core/common/src/main/kotlin/tachiyomi/core/provider/supplychain/)' /tmp/mangaall-future-host-changed.txt; then
            echo "::error::Signed package or unrelated privileged source changed"
            exit 1
          fi
          if grep -E '^app/' /tmp/mangaall-future-host-changed.txt; then
            # This separate reviewed research scope contains catalog/Reader and
            # instrumentation changes, not App Binder implementation changes.
            # Compare exact paths, not a wildcard App exemption; any added
            # App path (including AIDL/runtime) requires its own review.
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" &&
                  "${GITHUB_HEAD_REF:-}" == 'probe/mangaall-dual-source-scale30-20261123' &&
                  "${GITHUB_HEAD_REPO:-}" == "${GITHUB_REPOSITORY}" ]]; then
              cat > /tmp/mangaall-research-app-allowed.txt <<'EOF'
              app/src/androidTest/java/eu/kanade/tachiyomi/data/tsuzuki/instrumentation/MangaAllFrozen30CanonicalPersistenceInstrumentedTest.kt
              app/src/androidTest/java/eu/kanade/tachiyomi/data/tsuzuki/instrumentation/MangaAllIndependentCatalogLiveInstrumentedTest.kt
              app/src/androidTest/java/eu/kanade/tachiyomi/data/tsuzuki/instrumentation/MangaAllMangaDotCorroborationInstrumentedTest.kt
              app/src/androidTest/java/eu/kanade/tachiyomi/provider/runtime/MangaAllFrozen30Code11AndroidLiveInstrumentedTest.kt
              app/src/androidTest/java/eu/kanade/tachiyomi/provider/runtime/MangaAllFrozen30MangaDexAuditInstrumentedTest.kt
              app/src/androidTest/java/eu/kanade/tachiyomi/provider/runtime/MangaAllFutureRealDualSourceCode11InstrumentedTest.kt
              app/src/androidTest/java/eu/kanade/tachiyomi/provider/runtime/MangaAllFutureRealDualSourceCode11LiveInstrumentedTest.kt
              app/src/androidTest/java/eu/kanade/tachiyomi/provider/runtime/MangaAllMangaDotCreatorLiveInstrumentedTest.kt
              app/src/main/java/eu/kanade/tachiyomi/data/track/mangaupdates/MangaUpdates.kt
              app/src/main/java/eu/kanade/tachiyomi/data/track/mangaupdates/MangaUpdatesApi.kt
              app/src/main/java/eu/kanade/tachiyomi/data/track/mangaupdates/dto/MUAuthor.kt
              app/src/main/java/eu/kanade/tachiyomi/data/track/shikimori/ShikimoriApi.kt
              app/src/main/java/eu/kanade/tachiyomi/data/track/shikimori/dto/SMManga.kt
              app/src/main/java/eu/kanade/tachiyomi/data/tsuzuki/integration/MangaUpdatesIntegrationProvider.kt
              app/src/main/java/eu/kanade/tachiyomi/data/tsuzuki/integration/ShikimoriIntegrationProvider.kt
              app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderViewModel.kt
              app/src/test/java/eu/kanade/tachiyomi/data/track/shikimori/ShikimoriApiTest.kt
              app/src/test/java/eu/kanade/tachiyomi/data/tsuzuki/integration/MangaUpdatesIntegrationProviderTest.kt
              app/src/test/java/eu/kanade/tachiyomi/data/tsuzuki/integration/ShikimoriIntegrationProviderTest.kt
              EOF
              sed -i 's/^ *//' /tmp/mangaall-research-app-allowed.txt
              unexpected="$(grep '^app/' /tmp/mangaall-future-host-changed.txt | grep -Fxv -f /tmp/mangaall-research-app-allowed.txt || true)"
              if [[ -n "$unexpected" ]]; then
                printf '%s\n' "$unexpected"
                echo "::error::App path outside reviewed dual-source research scope"
                exit 1
              fi
              # Scope is still research only: no App Binder or signed package
              # changes; continue to the full core JVM and negative tests.
              echo 'MANGAALL_FUTURE_GRANT|signed_code10=UNCHANGED|app_binder=UNCHANGED|research_app=EXACT_ALLOWLIST|network=OFFLINE'
            else
            # Only the exact same-repository future Binder PR can touch App
            # sources, and it MUST pass its separately gated compile/test CI.
            if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ||
                  "${GITHUB_HEAD_REF:-}" != 'feat/mangaall-future-host-binder-code11-only-20261122' ||
                  "${GITHUB_HEAD_REPO:-}" != "${GITHUB_REPOSITORY}" ]]; then
              echo "::error::App Binder code is forbidden outside the reviewed code11 branch"
              exit 1
            fi
            for required in \
              '.github/workflows/mangaall-future-host-binder-offline.yml' \
              'app/src/main/aidl/eu/kanade/tachiyomi/provider/runtime/IProviderHostBridge.aidl' \
              'app/src/test/java/eu/kanade/tachiyomi/provider/runtime/MangaAllFutureHostBinderPolicyTest.kt' \
              'app/src/androidTest/java/eu/kanade/tachiyomi/provider/runtime/MangaAllFutureBinderSnapshotInstrumentedTest.kt'; do
              if ! grep -Fxq "$required" /tmp/mangaall-future-host-changed.txt; then
                echo "::error::Future Android Binder gate or negative test coverage missing"
                exit 1
              fi
            done
            echo 'MANGAALL_FUTURE_GRANT|signed_code10=UNCHANGED|app_binder=SEPARATELY_GATED|network=OFFLINE'
            fi
          else
            echo 'MANGAALL_FUTURE_GRANT|signed_code10=UNCHANGED|network=OFFLINE'
          fi
      - name: Kotlin formatter in read-only check mode
        run: ./gradlew :core:common:spotlessKotlinCheck --stacktrace
      - name: Full core common JVM suite with manifest rejection and Host JS bridge tests
        run: |
          ./gradlew :core:common:testDebugUnitTest --stacktrace
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=list(Path('core/common/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          assert reports
          counts={'tests':0,'failures':0,'errors':0}
          classes={}
          for f in reports:
              root=ET.parse(f).getroot()
              for k in counts: counts[k]+=int(root.get(k,'0'))
              classes[f.name]=int(root.get('tests','0'))
          assert counts['failures']==0 and counts['errors']==0
          for clazz in ['ProviderScriptPackageRuntimeTest','ProviderPackageParserTest','MangaAllFutureHostChapterSnapshotTest','MangaAllFutureHostQuickJsContinuationTest','ProviderQuickJsRuntimeTest']:
              assert sum(v for k,v in classes.items() if clazz in k)>0,clazz
          raw=sum(v for k,v in classes.items() if 'ProviderQuickJsRuntimeTest' in k)
          assert raw>=8, 'All raw QuickJs isolation regressions must be discovered'
          print('MANGAALL_FUTURE_GRANT|JUNIT='+str(counts['tests'])+'|closed=PASS')
          PY
      - name: Report closed JVM assertion failure type (no source data)
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for path in glob.glob('core/common/build/test-results/testDebugUnitTest/TEST-*.xml'):
              root=ET.parse(path).getroot()
              for test in root.findall('.//testcase'):
                  failure=test.find('failure')
                  if failure is None: continue
                  message=failure.attrib.get('message','')[:500].replace('\n',' ')
                  print('MANGAALL_JVM_FAILURE|class='+str(test.attrib.get('classname',''))+
                        '|name='+str(test.attrib.get('name',''))+'|message='+message)
              if 'ProviderScriptPackageRuntimeTest' in path:
                  for text in root.findall('.//system-out'):
                      if text.text:
                          for line in text.text.splitlines():
                              if line.startswith('MANGAALL_FUTURE_BRIDGE_NEGATIVE'):
                                  print(line[:300])
          PY
